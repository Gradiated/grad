                  maximum: 256
                  default: 32
                alpha:
                  type: integer
                  minimum: 1
                  maximum: 512
                  default: 32
                merge_on_export:
                  type: boolean
                  default: false
              required:
                - kind
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - prefix_kv
                num_tokens:
                  type: integer
                  minimum: 16
                  maximum: 4096
                  default: 256
              required:
                - kind
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - frozen_head
              required:
                - kind
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - encoder_full
              required:
                - kind
        lr:
          type: number
          exclusiveMinimum: 0
        lr_source:
          type: string
        batch_size:
          type: integer
          minimum: 1
        epochs:
          type: integer
          minimum: 1
        schedule:
          type: string
          enum:
            - linear
            - cosine
            - constant
        warmup:
          type: number
        train_on:
          type: string
          enum:
            - last
            - all_assistant
        thinking:
          type: string
          enum:
            - auto
            - on
            - off
        preserve_thinking:
          type: boolean
        reduction:
          type: string
          enum:
            - per_example
            - per_token
        select:
          type: string
          enum:
            - best
            - last
        checkpoint_every_steps:
          type: integer
          minimum: 1
        eval_every_steps:
          type: integer
          minimum: 1
        optimizer:
          $ref: "#/components/schemas/OptimizerSpec"
        checkpoint_ttl_days:
          type: integer
          minimum: 1
        split:
          type: object
          properties:
            strategy:
              type: string
              enum:
                - by_session
                - by_group
                - random
            eval_fraction:
              type: number
            seed:
              type: integer
            train_records:
              type: integer
              minimum: 0
            eval_records:
              type: integer
              minimum: 0
          required:
            - strategy
            - eval_fraction
            - seed
            - train_records
            - eval_records
        label_eval_id:
          type:
            - string
            - "null"
          description: "The labeling eval whose answers the run trains on: router runs with a Judge/validator rubric, and
            off-policy distill runs (the teacher's answers)."
        base_artifact:
          $ref: "#/components/schemas/BaseArtifact"
        recipe_params:
          type: object
          additionalProperties: {}
        checkpoint_evals:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
              dataset:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
              dataset_version:
                type: integer
                minimum: 1
              rubric:
                type: array
                items:
                  $ref: "#/components/schemas/EvalRubricItem"
              limit:
                type:
                  - integer
                  - "null"
                minimum: 1
            required:
              - name
              - dataset
              - dataset_version
              - rubric
              - limit
          description: recipe.evals, with the dataset version and rubric pinned.
        loggers:
          type: array
          items:
            $ref: "#/components/schemas/LoggerSpec"
      required:
        - rule_version
        - dataset
        - dataset_version
        - name
        - recipe_kind
        - model
        - template_revision
        - adapter
        - lr
        - lr_source
        - batch_size
        - epochs
        - schedule
        - warmup
        - train_on
        - thinking
        - preserve_thinking
        - reduction
        - select
        - checkpoint_every_steps
        - eval_every_steps
        - optimizer
        - checkpoint_ttl_days
        - split
        - label_eval_id
        - base_artifact
        - recipe_params
    OptimizerSpec:
      type: object
      properties:
        kind:
          type: string
          enum:
            - adamw
          default: adamw
        betas:
          type: array
          prefixItems:
            - type: number
              minimum: 0
              exclusiveMaximum: 1
            - type: number
              minimum: 0
              exclusiveMaximum: 1
          default:
            - 0.9
            - 0.95
        weight_decay:
          type: number
          minimum: 0
          maximum: 1
          default: 0
        grad_clip:
          type: number
          minimum: 0
          maximum: 1000
          default: 1
          description: Max global gradient norm; 0 disables clipping.
      additionalProperties: false
    BaseArtifact:
      type:
        - object
        - "null"
      properties:
        id:
          type: string
          minLength: 1
        recipe_kind:
          $ref: "#/components/schemas/RecipeKind"
        format:
          type: string
          enum:
            - peft_lora
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - id
        - recipe_kind
        - format
        - sha256
      description: "Continued training: the artifact whose adapter the run starts from (recipe.model was an artifact reference)."
    LoggerSpec:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - wandb
            project:
              type: string
              minLength: 1
              maxLength: 128
            entity:
              type: string
              minLength: 1
              maxLength: 128
            host:
              type: string
              format: uri
              description: W&B server (default https://api.wandb.ai).
            secret:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
              description: Workspace secret holding the W&B API key.
            run_name:
              type: string
              minLength: 1
              maxLength: 128
              description: "Tracker run name (default: the grad run name)."
          required:
            - kind
            - project
            - secret
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              enum:
                - mlflow
            tracking_uri:
              type: string
              format: uri
            experiment:
              type: string
              minLength: 1
              maxLength: 256
            secret:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
              description: Workspace secret holding a bearer token for the tracking server, if it needs one.
            run_name:
              type: string
              minLength: 1
              maxLength: 128
              description: "Tracker run name (default: the grad run name)."
          required:
            - kind
            - tracking_uri
          additionalProperties: false
    PlanRunRequest:
      type: object
      properties:
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        recipe:
          $ref: "#/components/schemas/RecipeSpec"
        split:
          $ref: "#/components/schemas/SplitSpec"
        max_cost_usd:
          type: number
          exclusiveMinimum: 0
      required:
        - dataset
        - name
        - recipe
      additionalProperties: false
    RecipeSpec:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/RecipeKind"
        model:
          type: string
          minLength: 1
          maxLength: 160
        adapter:
          $ref: "#/components/schemas/AdapterSpec"
        lr:
          anyOf:
            - type: string
              enum:
                - auto
            - type: number
              exclusiveMinimum: 0
          default: auto
        lr_scale:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          default: 1
        batch_size:
          type: integer
          minimum: 1
          maximum: 4096
        epochs:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
        schedule:
          type: string
          enum:
            - linear
            - cosine
            - constant
          default: linear
        warmup:
          type: number
          minimum: 0
          maximum: 0.5
          default: 0.03
        train_on:
          type: string
          enum:
            - last
            - all_assistant
          default: last
        thinking:
          type: string
          enum:
            - auto
            - on
            - off
          default: auto
        preserve_thinking:
          type: boolean
          default: false
        reduction:
          type: string
          enum:
            - per_example
            - per_token
          description: Default per_example.
        select:
          type: string
          enum:
            - best
            - last
          default: best
        checkpoint_ttl_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        beta:
          type: number
          exclusiveMinimum: 0
        models:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 160
        max_quality_drop:
          type: number
          minimum: 0
          maximum: 0.5
        context_text:
          type: string
          maxLength: 4000000
        num_tokens:
          type: integer
          minimum: 16
          maximum: 4096
        temp:
          type: number
          exclusiveMinimum: 0
        teacher:
          type: string
          minLength: 1
          maxLength: 160
          description: "CartridgeRecipe and DistillRecipe: the model to learn from. DistillRecipe also takes an artifact
            (name@version) with rollout off_policy."
        rollout:
          $ref: "#/components/schemas/RolloutSpec"
        optimizer:
          $ref: "#/components/schemas/OptimizerSpec"
        eval_every:
          anyOf:
            - type: string
              enum:
                - auto
            - type: integer
              minimum: 1
          default: auto
          description: Optimizer steps between held-out evaluations; auto = every 10% of steps (the checkpoint interval).
        loss:
          $ref: "#/components/schemas/LossSpec"
        pool:
          $ref: "#/components/schemas/PoolingSpec"
        rubric:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: array
              items:
                $ref: "#/components/schemas/EvalRubricItem"
              minItems: 1
              maxItems: 32
          description: "RouterRecipe: a score name on your records (scores[rubric]), or Judge/validator items: the server then
            replays each prompt against recipe.models and scores the answers in a labeling eval before training.
            RewardModelRecipe: a score name in [0, 1] on records ending in an assistant turn, trained pointwise next to
            the chosen/rejected pairs."
        pricing:
          type: object
          additionalProperties:
            type: number
            minimum: 0
          description: "RouterRecipe: USD per request for each candidate; overrides metrics.cost_usd on your records."
        fallback:
          type: string
          minLength: 1
          maxLength: 160
          description: "RouterRecipe: the candidate that gets every request the router does not offload (default: the best-scoring
            candidate)."
        max_new_tokens:
          type: integer
          minimum: 1
          maximum: 8192
          description: "CartridgeRecipe: teacher answer length per prompt during distillation (default 256)."
        slot_token:
          type: string
          minLength: 1
          maxLength: 64
          description: "CartridgeRecipe: a reserved token that marks where the cartridge goes (default: the first reserved token
            that tokenizes atomically)."
        evals:
          type: array
          items:
            $ref: "#/components/schemas/RecipeEval"
          minItems: 1
          maxItems: 4
          description: Extra evals on each checkpoint during training (the eval executor, billed like any eval). Results are in
            run.checkpoint_evals, the run's checkpoint_eval events and eval_report.checkpoint_evals.
        loggers:
          type: array
          items:
            $ref: "#/components/schemas/LoggerSpec"
          minItems: 1
          maxItems: 4
          description: Experiment trackers that receive the run's metrics. A tracker that fails is reported and dropped; it never
            fails the run.
      required:
        - kind
      additionalProperties: false
    AdapterSpec:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - lora
            rank:
              type: integer
              minimum: 1
              maximum: 256
              default: 32
            alpha:
              type: integer
              minimum: 1
              maximum: 512
              default: 32
            merge_on_export:
              type: boolean
              default: false
          required:
            - kind
        - type: object
          properties:
            kind:
              type: string
              enum:
                - prefix_kv
            num_tokens:
              type: integer
              minimum: 16
              maximum: 4096
              default: 256
          required:
            - kind
        - type: object
          properties:
            kind:
              type: string
              enum:
                - frozen_head
          required:
            - kind
    RolloutSpec:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - on_policy
            max_new_tokens:
              anyOf:
                - type: string
                  enum:
                    - auto
                - type: integer
                  minimum: 1
                  maximum: 8192
              description: Length of each student answer; auto (default) sizes it from the assistant turns in your records (256
                without any).
          required:
            - kind
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              enum:
                - off_policy
            max_new_tokens:
              type: integer
              minimum: 1
              maximum: 8192
          required:
            - kind
          additionalProperties: false
      description: "DistillRecipe: on_policy (default) samples answers from the student and the trainer scores them with the
        teacher's top-k logits; off_policy has the teacher answer each prompt once through the inference endpoint and
        trains the student on those answers."
    LossSpec:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - cross_entropy
            reduction:
              type: string
              enum:
                - per_example
                - per_token
          required:
            - kind
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              enum:
                - dpo
            beta:
              type: number
              exclusiveMinimum: 0
          required:
            - kind
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              enum:
                - infonce
            temp:
              type: number
              exclusiveMinimum: 0
          required:
            - kind
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              enum:
                - top_k_kl_distill
            top_k:
              type: integer
              minimum: 1
              maximum: 256
          required:
            - kind
          additionalProperties: false
    PoolingSpec:
      type: object
      properties:
        kind:
          type: string
          enum:
            - mean
            - cls
      required:
        - kind
      additionalProperties: false
    RecipeEval:
      type: object
      properties:
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        version:
          type: integer
          minimum: 1
          description: "Dataset version (default: the current one, pinned at plan time)."
        rubric:
          type: array
          items:
            $ref: "#/components/schemas/EvalRubricItem"
          minItems: 1
          maxItems: 32
          description: "Judges, regexes and validators (default: the dataset's own rubric, such as a benchmark's answer check).
            Code scorers can't run during training."
        limit:
          type: integer
          minimum: 1
          maximum: 100000
          description: Evaluate the first N tasks at each checkpoint.
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
          description: "Name of this eval in the report (default: the dataset name)."
      required:
        - dataset
      additionalProperties: false
    SplitSpec:
      type: object
      properties:
        strategy:
          type: string
          enum:
            - by_session
            - by_group
            - random
          default: by_session
        eval_fraction:
          type: number
          minimum: 0
          maximum: 0.5
        seed:
          type: integer
          default: 42
    Run:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        dataset_id:
          type: string
          minLength: 1
        dataset_name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        dataset_version:
          type: integer
          minimum: 0
        recipe_kind:
          $ref: "#/components/schemas/RecipeKind"
        status:
          $ref: "#/components/schemas/RunStatus"
        resolved_config:
          $ref: "#/components/schemas/ResolvedRunConfig"
        max_cost_usd:
          type:
            - number
            - "null"
          exclusiveMinimum: 0
        price_per_million_tokens:
          type: number
          exclusiveMinimum: 0
        tokens_processed:
          type: integer
          minimum: 0
        cost_usd:
          type: number
          minimum: 0
        current_step:
          type: integer
          minimum: 0
        total_steps:
          type: integer
          minimum: 0
        attempt:
          type: integer
          minimum: 0
          description: Attempts started so far (every start on a worker counts, including ones whose GPU was reclaimed).
        max_attempts:
          type: integer
          minimum: 1
          description: The run fails once this many attempts end without a result (lost worker, worker error, OOM). Attempts whose
            GPU was reclaimed don't count toward it.
        phase:
          type:
            - string
            - "null"
          enum:
            - queued
            - waiting_for_compute
            - starting
            - loading_model
            - training
            - evaluating
            - checkpointing
            - uploading
            - completing
            - null
        phase_since:
          type:
            - string
            - "null"
          format: date-time
        last_interruption:
          $ref: "#/components/schemas/RunInterruption"
        workers_online:
          type:
            - integer
            - "null"
          minimum: 0
          description: "While queued: workers of this kind holding a lease (all busy). Null otherwise."
        autoscaling:
          type:
            - boolean
            - "null"
          description: "While queued: true when workers scale from zero (KEDA), so a worker is starting. Null otherwise."
        latest_metric:
          $ref: "#/components/schemas/MetricPoint"
        eval_report:
          $ref: "#/components/schemas/EvalReport"
        checkpoint_evals:
          type: array
          items:
            $ref: "#/components/schemas/CheckpointEvalResult"
          description: "recipe.evals results, one per finished eval: a checkpoint (step) on a dataset."
        artifact_id:
          type:
            - string
            - "null"
        error:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - workspace_id
        - name
        - dataset_id
        - dataset_name
        - dataset_version
        - recipe_kind
        - status
        - resolved_config
        - max_cost_usd
        - price_per_million_tokens
        - tokens_processed
        - cost_usd
        - current_step
        - total_steps
        - attempt
        - max_attempts
        - phase
        - phase_since
        - last_interruption
        - workers_online
        - autoscaling
        - latest_metric
        - eval_report
        - checkpoint_evals
        - artifact_id
        - error
        - created_at
        - updated_at
        - finished_at
    RunStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - cancelled
        - stopped_budget
        - stopped_balance
      description: "stopped_budget: the run reached its max_cost_usd (resume with a higher cap). stopped_balance: the
        workspace ran out of balance on Cloud (top up, then resume; the cap is unchanged). Both keep their checkpoints."
    RunInterruption:
      type:
        - object
        - "null"
      properties:
        attempt:
          type: integer
          minimum: 1
        reason:
          $ref: "#/components/schemas/InterruptionReason"
        step:
          type: integer
          minimum: 0
        resume_step:
          type:
            - integer
            - "null"
          minimum: 0
        at:
          type: string
          format: date-time
        message:
          type: string
      required:
        - attempt
        - reason
        - step
        - resume_step
        - at
        - message
    InterruptionReason:
      type: string
      enum:
        - lease_lost
        - compute_reclaimed
        - worker_error
        - oom
      description: "Why an attempt ended without a result: lease_lost (the worker was lost: it stopped heartbeating after a
        crash, kill or network failure), compute_reclaimed (the GPU was reclaimed; the worker saved a checkpoint when it
        had time and handed the run back), worker_error (the worker hit an unexpected error and handed the run back),
        oom (CUDA out of memory)."
    MetricPoint:
      type:
        - object
