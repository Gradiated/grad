openapi: 3.1.0
info:
  title: Gradiated Training & Serving API
  version: 0.2.0
components:
  schemas:
    IdempotencyKey:
      type: string
      pattern: ^[\x21-\x7e]{1,255}$
      description: "Up to 255 visible ASCII characters (SDKs send a UUIDv4 and reuse it across retries). A retry with the same
        key and body replays the stored response with `Idempotent-Replayed: true`; the same key with a different body is
        rejected with 422 `idempotency_key_reused`; a retry while the first request is still running gets 409
        `idempotency_in_progress` with Retry-After. The key is stored in the same transaction as the request's writes;
        responses are kept for 24 hours, and 5xx and 429 responses are not stored."
      example: 5f0c8d1e-3b8a-4c39-9a4e-2f1f0b6f4a21
    TrainableModel:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        hf_repo:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 200
        family:
          type: string
          enum:
            - llm
            - encoder
        adapters:
          type: array
          items:
            type: string
            enum:
              - lora
              - prefix_kv
              - frozen_head
              - encoder_full
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/RecipeKind"
        default_for:
          type: array
          items:
            $ref: "#/components/schemas/RecipeKind"
        price_per_million_tokens_usd:
          type: number
          exclusiveMinimum: 0
        max_context_tokens:
          type: integer
          exclusiveMinimum: 0
        template_revision:
          type: string
          minLength: 1
        calibrated_lrs:
          type: object
          additionalProperties:
            type: number
            exclusiveMinimum: 0
      required:
        - id
        - hf_repo
        - family
        - adapters
        - recipes
        - default_for
        - price_per_million_tokens_usd
        - max_context_tokens
        - template_revision
        - calibrated_lrs
    RecipeKind:
      type: string
      enum:
        - sft
        - dpo
        - router
        - decision
        - cartridge
        - embedding
        - distill
        - reward
        - grpo
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 4000
        code:
          type: string
          minLength: 1
          maxLength: 80
        request_id:
          type: string
          minLength: 1
      required:
        - type
        - title
        - status
        - detail
        - code
        - request_id
    CreatedApiKey:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/ApiKey"
        secret:
          type: string
      required:
        - key
        - secret
    ApiKey:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        prefix:
          type: string
          minLength: 1
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        created_at:
          type: string
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - workspace_id
        - name
        - prefix
        - scopes
        - created_at
        - revoked_at
    ApiKeyScope:
      type: string
      enum:
        - admin
        - datasets:read
        - datasets:write
        - runs:read
        - runs:write
        - artifacts:read
        - artifacts:write
        - deployments:write
        - feedback:write
        - env:serve
    CreateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
          minItems: 1
      required:
        - name
        - scopes
    Dataset:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        version:
          type: integer
          minimum: 0
        record_count:
          type: integer
          minimum: 0
        metadata:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - workspace_id
        - name
        - version
        - record_count
        - metadata
        - created_at
        - updated_at
    CreateDatasetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        metadata:
          type: object
          additionalProperties: {}
      required:
        - name
    PushDatasetRequest:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/DatasetRecord"
          minItems: 1
          maxItems: 50000
        metadata:
          type: object
          additionalProperties: {}
      required:
        - records
    DatasetRecord:
      type: object
      properties:
        schema:
          type: string
          enum:
            - grad.trajectory/1
        id:
          type: string
          minLength: 1
          maxLength: 160
        session_id:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 160
        group_id:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 160
        role:
          type:
            - string
            - "null"
          enum:
            - chosen
            - rejected
            - anchor
            - positive
            - negative
            - desirable
            - undesirable
            - rollout
            - null
        source:
          type:
            - string
            - "null"
          maxLength: 80
        timestamp:
          type:
            - string
            - "null"
          maxLength: 64
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        tools:
          type: array
          items:
            type: object
            additionalProperties: {}
        input:
          $ref: "#/components/schemas/TrajectoryInput"
        output:
          $ref: "#/components/schemas/TrajectoryOutput"
        prompt:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
        completion:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
        chosen:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
        rejected:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
        query:
          type: string
        positive:
          type: string
        negatives:
          type: array
          items:
            type: string
        state: {}
        questions:
          type: object
          additionalProperties: {}
        expected_output: {}
        scores:
          type: object
          additionalProperties:
            type: number
        metrics:
          type: object
          additionalProperties:
            type: number
        metadata:
          type: object
          additionalProperties: {}
      additionalProperties: false
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
            - tool
        content:
          anyOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: {}
            - type: "null"
        tool_calls:
          type: array
          items:
            type: object
            additionalProperties: {}
        tool_call_id:
          type: string
        name:
          type: string
        train:
          type: boolean
      required:
        - role
      additionalProperties: {}
    TrajectoryInput:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        tools:
          type: array
          items:
            type: object
            additionalProperties: {}
        media:
          type: array
          items:
            type: object
            additionalProperties: {}
        features:
          type: object
          additionalProperties: {}
        payload: {}
      additionalProperties: {}
    TrajectoryOutput:
      type:
        - object
        - "null"
      properties:
        turns:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        payload: {}
      additionalProperties: {}
    DatasetRecordsPage:
      type: object
      properties:
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        version:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: "#/components/schemas/DatasetRecord"
        next_cursor:
          type:
            - string
            - "null"
          description: Pass back as `cursor` for the next page; null on the last page (every list endpoint).
      required:
        - dataset
        - version
        - total
        - data
        - next_cursor
    RenderDatasetResponse:
      type: object
      properties:
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        model:
          type: string
        template_revision:
          type: string
        token_counts:
          type: string
          enum:
            - estimated
          description: Token counts (total, trained and per span) are estimates (about 4 characters per token); the trainer
            tokenizes with the model's pinned tokenizer, and the run's metrics report the exact tokens.
        examples:
          type: array
          items:
            type: object
            properties:
              record_id:
                type: string
              template_revision:
                type: string
              total_tokens:
                type: integer
                minimum: 0
              trained_tokens:
                type: integer
                minimum: 0
              trained_fraction:
                type: number
                minimum: 0
                maximum: 1
              spans:
                type: array
                items:
                  type: object
                  properties:
                    text:
                      type: string
                    trained:
                      type: boolean
                    tokens:
                      type: integer
                      minimum: 0
                  required:
                    - text
                    - trained
                    - tokens
            required:
              - record_id
              - template_revision
              - total_tokens
              - trained_tokens
              - trained_fraction
              - spans
      required:
        - dataset
        - model
        - template_revision
        - token_counts
        - examples
    RenderDatasetRequest:
      type: object
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 160
          default: qwen/qwen3-8b
        train_on:
          type: string
          enum:
            - last
            - all_assistant
          default: last
        thinking:
          type: string
          enum:
            - auto
            - on
            - off
          default: auto
        preserve_thinking:
          type: boolean
          default: false
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
    UploadTicket:
      type: object
      properties:
        upload_id:
          type: string
          minLength: 1
        method:
          type: string
          enum:
            - PUT
        url:
          type: string
          minLength: 1
          description: Absolute presigned URL, or a path relative to the API base URL (local storage).
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
      required:
        - upload_id
        - method
        - url
        - headers
        - expires_at
    CreateUploadRequest:
      type: object
      properties:
        purpose:
          type: string
          enum:
            - dataset_import
        filename:
          type: string
          minLength: 1
          maxLength: 255
        size_bytes:
          type: integer
          minimum: 1
          maximum: 5368709120
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - purpose
        - filename
        - size_bytes
        - sha256
    ImportJob:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        status:
          $ref: "#/components/schemas/ImportStatus"
        source:
          type: object
          additionalProperties: {}
        connector:
          type: string
          enum:
            - auto
            - grad_trajectories
            - openai_chat
            - gradiated
            - otel
            - langfuse
            - posthog
            - braintrust
            - langsmith
        attempt:
          type: integer
          minimum: 0
        imported_count:
          type: integer
          minimum: 0
        dropped_count:
          type: integer
          minimum: 0
        detected_scores:
          type: array
          items:
            type: string
        drop_reasons:
          type: array
          items:
            type: string
          description: "Why rows were dropped, one line per row (`line 12: invalid JSON`), capped at 100 entries."
        dataset_version:
          type:
            - integer
            - "null"
          minimum: 0
        error:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - workspace_id
        - dataset
        - status
        - source
        - connector
        - attempt
        - imported_count
        - dropped_count
        - detected_scores
        - drop_reasons
        - dataset_version
        - error
        - created_at
        - updated_at
    ImportStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
    CreateImportRequest:
      type: object
      properties:
        source:
          $ref: "#/components/schemas/ImportSource"
        connector:
          type: string
          enum:
            - auto
            - grad_trajectories
            - openai_chat
            - gradiated
            - otel
            - langfuse
            - posthog
            - braintrust
            - langsmith
          default: auto
      required:
        - source
    ImportSource:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - upload
            upload_id:
              type: string
              minLength: 1
              maxLength: 160
            format:
              type: string
              enum:
                - auto
                - jsonl
                - json
                - parquet
              default: auto
          required:
            - kind
            - upload_id
        - type: object
          properties:
            kind:
              type: string
              enum:
                - hf
            repo:
              type: string
              minLength: 1
              maxLength: 200
              pattern: ^[A-Za-z0-9][\w.-]*(\/[\w.-]+)?$
            split:
              type: string
              minLength: 1
              maxLength: 64
              default: train
            config:
              type: string
              minLength: 1
              maxLength: 128
            revision:
              type: string
              minLength: 1
              maxLength: 128
            columns:
              $ref: "#/components/schemas/HfColumnMapping"
            limit:
              type: integer
              minimum: 1
              maximum: 10000000
          required:
            - kind
            - repo
    HfColumnMapping:
      type: object
      properties:
        messages:
          type: string
          minLength: 1
          maxLength: 128
        prompt:
          type: string
          minLength: 1
          maxLength: 128
        completion:
          type: string
          minLength: 1
          maxLength: 128
        chosen:
          type: string
          minLength: 1
          maxLength: 128
        rejected:
          type: string
          minLength: 1
          maxLength: 128
        answer:
          type: string
          minLength: 1
          maxLength: 128
        query:
          type: string
          minLength: 1
          maxLength: 128
        positive:
          type: string
          minLength: 1
          maxLength: 128
      default: {}
    PlanRunResponse:
      type: object
      properties:
        resolved_config:
          $ref: "#/components/schemas/ResolvedRunConfig"
        dataset_version:
          type: integer
          minimum: 0
        usable_records:
          type: integer
          minimum: 0
        total_records:
          type: integer
          minimum: 0
        estimated_steps:
          type: integer
          minimum: 0
        estimated_tokens:
          type: integer
          minimum: 0
        estimated_cost_usd:
          type: number
          minimum: 0
        price_per_million_tokens:
          type: number
          exclusiveMinimum: 0
        trained_token_fraction:
          type: number
          minimum: 0
          maximum: 1
        labeling:
          type:
            - object
            - "null"
          properties:
            estimated_model_calls:
              type: integer
              minimum: 0
            estimated_judge_calls:
              type: integer
              minimum: 0
            estimated_cost_usd:
              type: number
              minimum: 0
          required:
            - estimated_model_calls
            - estimated_judge_calls
            - estimated_cost_usd
          description: "The labeling eval that runs before training (billed as an eval, included in estimated_cost_usd): router
            runs with a Judge/validator rubric replay prompts against the candidates; off-policy distill runs have the
            teacher answer each prompt."
        teacher:
          type:
            - object
            - "null"
          properties:
            model:
              type: string
            price_per_million_tokens:
              type: number
              minimum: 0
            estimated_tokens:
              type: integer
              minimum: 0
            estimated_cost_usd:
              type: number
              minimum: 0
          required:
            - model
            - price_per_million_tokens
            - estimated_tokens
            - estimated_cost_usd
          description: "On-policy distill runs: the teacher's scoring tokens at the teacher's price (included in estimated_tokens
            as student-price tokens, and in estimated_cost_usd)."
        warnings:
          type: array
          items:
            type: string
      required:
        - resolved_config
        - dataset_version
        - usable_records
        - total_records
        - estimated_steps
        - estimated_tokens
        - estimated_cost_usd
        - price_per_million_tokens
        - trained_token_fraction
        - labeling
        - teacher
        - warnings
    ResolvedRunConfig:
      type: object
      properties:
        rule_version:
          type: string
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        dataset_version:
          type: integer
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        recipe_kind:
          $ref: "#/components/schemas/RecipeKind"
        model:
          type: string
        template_revision:
          type: string
        adapter:
          anyOf:
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - lora
                rank:
                  type: integer
                  minimum: 1
                  maximum: 256
                  default: 32
                alpha:
                  type: integer
                  minimum: 1
                  maximum: 512
                  default: 32
                merge_on_export:
                  type: boolean
                  default: false
              required:
                - kind
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - prefix_kv
                num_tokens:
                  type: integer
                  minimum: 16
                  maximum: 4096
                  default: 256
              required:
                - kind
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - frozen_head
              required:
                - kind
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - encoder_full
              required:
                - kind
        lr:
          type: number
          exclusiveMinimum: 0
        lr_source:
          type: string
        batch_size:
          type: integer
          minimum: 1
        epochs:
          type: integer
          minimum: 1
        schedule:
          type: string
          enum:
            - linear
            - cosine
            - constant
        warmup:
          type: number
        train_on:
          type: string
          enum:
            - last
            - all_assistant
        thinking:
          type: string
          enum:
            - auto
            - on
            - off
        preserve_thinking:
          type: boolean
        reduction:
          type: string
          enum:
            - per_example
            - per_token
        select:
          type: string
          enum:
            - best
            - last
        checkpoint_every_steps:
          type: integer
          minimum: 1
        eval_every_steps:
          type: integer
          minimum: 1
        optimizer:
          $ref: "#/components/schemas/OptimizerSpec"
        checkpoint_ttl_days:
          type: integer
          minimum: 1
        split:
          type: object
          properties:
            strategy:
              type: string
              enum:
                - by_session
                - by_group
                - random
            eval_fraction:
              type: number
            seed:
              type: integer
            train_records:
              type: integer
              minimum: 0
            eval_records:
              type: integer
              minimum: 0
          required:
            - strategy
            - eval_fraction
            - seed
            - train_records
            - eval_records
        label_eval_id:
          type:
            - string
            - "null"
          description: "The labeling eval whose answers the run trains on: router runs with a Judge/validator rubric, and
            off-policy distill runs (the teacher's answers)."
        base_artifact:
          $ref: "#/components/schemas/BaseArtifact"
        recipe_params:
          type: object
          additionalProperties: {}
      required:
        - rule_version
        - dataset
        - dataset_version
        - name
        - recipe_kind
        - model
        - template_revision
        - adapter
        - lr
        - lr_source
        - batch_size
        - epochs
        - schedule
        - warmup
        - train_on
        - thinking
        - preserve_thinking
        - reduction
        - select
        - checkpoint_every_steps
        - eval_every_steps
        - optimizer
        - checkpoint_ttl_days
        - split
        - label_eval_id
        - base_artifact
        - recipe_params
    OptimizerSpec:
      type: object
      properties:
        kind:
          type: string
          enum:
            - adamw
          default: adamw
        betas:
          type: array
          prefixItems:
            - type: number
              minimum: 0
              exclusiveMaximum: 1
            - type: number
              minimum: 0
              exclusiveMaximum: 1
          default:
            - 0.9
            - 0.95
        weight_decay:
          type: number
          minimum: 0
          maximum: 1
          default: 0
        grad_clip:
          type: number
          minimum: 0
          maximum: 1000
          default: 1
          description: Max global gradient norm; 0 disables clipping.
      additionalProperties: false
    BaseArtifact:
      type:
        - object
        - "null"
      properties:
        id:
          type: string
          minLength: 1
        recipe_kind:
          $ref: "#/components/schemas/RecipeKind"
        format:
          type: string
          enum:
            - peft_lora
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - id
        - recipe_kind
        - format
        - sha256
      description: "Continued training: the artifact whose adapter the run starts from (recipe.model was an artifact reference)."
    PlanRunRequest:
      type: object
      properties:
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        recipe:
          $ref: "#/components/schemas/RecipeSpec"
        split:
          $ref: "#/components/schemas/SplitSpec"
        max_cost_usd:
          type: number
          exclusiveMinimum: 0
      required:
        - dataset
        - name
        - recipe
      additionalProperties: false
    RecipeSpec:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/RecipeKind"
        model:
          type: string
          minLength: 1
          maxLength: 160
        adapter:
          $ref: "#/components/schemas/AdapterSpec"
        lr:
          anyOf:
            - type: string
              enum:
                - auto
            - type: number
              exclusiveMinimum: 0
          default: auto
        lr_scale:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          default: 1
        batch_size:
          type: integer
          minimum: 1
          maximum: 4096
        epochs:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
        schedule:
          type: string
          enum:
            - linear
            - cosine
            - constant
          default: linear
        warmup:
          type: number
          minimum: 0
          maximum: 0.5
          default: 0.03
        train_on:
          type: string
          enum:
            - last
            - all_assistant
          default: last
        thinking:
          type: string
          enum:
            - auto
            - on
            - off
          default: auto
        preserve_thinking:
          type: boolean
          default: false
        reduction:
          type: string
          enum:
            - per_example
            - per_token
          description: Default per_example.
        select:
          type: string
          enum:
            - best
            - last
          default: best
        checkpoint_ttl_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        beta:
          type: number
          exclusiveMinimum: 0
        models:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 160
        max_quality_drop:
          type: number
          minimum: 0
          maximum: 0.5
        context_text:
          type: string
          maxLength: 4000000
        context_uri:
          type: string
          maxLength: 2048
        num_tokens:
          type: integer
          minimum: 16
          maximum: 4096
        temp:
          type: number
          exclusiveMinimum: 0
        teacher:
          type: string
          minLength: 1
          maxLength: 160
          description: "CartridgeRecipe and DistillRecipe: the model to learn from. DistillRecipe also takes an artifact
            (name@version) with rollout off_policy."
        rollout:
          $ref: "#/components/schemas/RolloutSpec"
        optimizer:
          $ref: "#/components/schemas/OptimizerSpec"
        eval_every:
          anyOf:
            - type: string
              enum:
                - auto
            - type: integer
              minimum: 1
          default: auto
          description: Optimizer steps between held-out evaluations; auto = every 10% of steps (the checkpoint interval).
        loss:
          $ref: "#/components/schemas/LossSpec"
        pool:
          $ref: "#/components/schemas/PoolingSpec"
        rubric:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: array
              items:
                $ref: "#/components/schemas/EvalRubricItem"
              minItems: 1
              maxItems: 32
          description: "RouterRecipe: a score name on your records (scores[rubric]), or Judge/validator items: the server then
            replays each prompt against recipe.models and scores the answers in a labeling eval before training.
            RewardModelRecipe: a score name in [0, 1] on records ending in an assistant turn, trained pointwise next to
            the chosen/rejected pairs."
        pricing:
          type: object
          additionalProperties:
            type: number
            minimum: 0
          description: "RouterRecipe: USD per request for each candidate; overrides metrics.cost_usd on your records."
        fallback:
          type: string
          minLength: 1
          maxLength: 160
          description: "RouterRecipe: the candidate that gets every request the router does not offload (default: the best-scoring
            candidate)."
        max_new_tokens:
          type: integer
          minimum: 1
          maximum: 8192
          description: "CartridgeRecipe: teacher answer length per prompt during distillation (default 256)."
        slot_token:
          type: string
          minLength: 1
          maxLength: 64
          description: "CartridgeRecipe: a reserved token that marks where the cartridge goes (default: the first reserved token
            that tokenizes atomically)."
      required:
        - kind
      additionalProperties: false
    AdapterSpec:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - lora
            rank:
              type: integer
              minimum: 1
              maximum: 256
              default: 32
            alpha:
              type: integer
              minimum: 1
              maximum: 512
              default: 32
            merge_on_export:
              type: boolean
              default: false
          required:
            - kind
        - type: object
          properties:
            kind:
              type: string
              enum:
                - prefix_kv
            num_tokens:
              type: integer
              minimum: 16
              maximum: 4096
              default: 256
          required:
            - kind
        - type: object
          properties:
            kind:
              type: string
              enum:
                - frozen_head
          required:
            - kind
    RolloutSpec:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - on_policy
            max_new_tokens:
              anyOf:
                - type: string
                  enum:
                    - auto
                - type: integer
                  minimum: 1
                  maximum: 8192
              description: Length of each student answer; auto (default) sizes it from the assistant turns in your records (256
                without any).
          required:
            - kind
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              enum:
                - off_policy
            max_new_tokens:
              type: integer
              minimum: 1
              maximum: 8192
          required:
            - kind
          additionalProperties: false
      description: "DistillRecipe: on_policy (default) samples answers from the student and the trainer scores them with the
        teacher's top-k logits; off_policy has the teacher answer each prompt once through the inference endpoint and
        trains the student on those answers."
    LossSpec:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - cross_entropy
            reduction:
              type: string
              enum:
                - per_example
                - per_token
          required:
            - kind
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              enum:
                - dpo
            beta:
              type: number
              exclusiveMinimum: 0
          required:
            - kind
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              enum:
                - infonce
            temp:
              type: number
              exclusiveMinimum: 0
          required:
            - kind
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              enum:
                - top_k_kl_distill
            top_k:
              type: integer
              minimum: 1
              maximum: 256
          required:
            - kind
          additionalProperties: false
