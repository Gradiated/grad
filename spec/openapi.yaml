      type: object
      properties:
        accepted:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/EvalStatus"
        pending_local_scores:
          type: integer
          minimum: 0
      required:
        - accepted
        - status
        - pending_local_scores
    PostEvalScoresRequest:
      type: object
      properties:
        scores:
          type: array
          items:
            type: object
            properties:
              output_id:
                type: string
                minLength: 1
              scorer:
                type: string
                minLength: 1
                maxLength: 80
              score:
                type: number
                minimum: 0
                maximum: 1
            required:
              - output_id
              - scorer
              - score
          minItems: 1
          maxItems: 10000
      required:
        - scores
    EvalTaskOutcome:
      type: object
      properties:
        task_id:
          type: string
        model:
          type: string
        score:
          type: number
        passed:
          type: boolean
        sample_scores:
          type: array
          items:
            type: number
        judge_model:
          type:
            - string
            - "null"
        record:
          $ref: "#/components/schemas/DatasetRecord"
      required:
        - task_id
        - model
        - score
        - passed
        - sample_scores
        - judge_model
        - record
    Secret:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
          description: Lowercase letters, digits, '.', '_' and '-'; unique per workspace.
        workspace_id:
          type: string
          minLength: 1
        allowed_hosts:
          type: array
          items:
            type: string
          description: The hosts this secret may be sent to.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - name
        - workspace_id
        - allowed_hosts
        - created_at
        - updated_at
      description: A workspace secret's metadata. The value is never returned.
    SetSecretRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
          description: Lowercase letters, digits, '.', '_' and '-'; unique per workspace.
        value:
          type: string
          minLength: 1
          description: "Write-only: stored encrypted and never returned by any endpoint."
        allowed_hosts:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 260
          maxItems: 32
          description: "Hosts (`host[:port]`, or URLs) this secret may be sent to: a source's host, huggingface.co for HF imports,
            a logger's host. Default: the public hosts of the supported providers (cloud.langfuse.com,
            us.cloud.langfuse.com, api.smith.langchain.com, eu.api.smith.langchain.com, api.braintrust.dev,
            us.posthog.com, eu.posthog.com, app.phoenix.arize.com, huggingface.co, api.wandb.ai). A secret for a
            self-hosted tool must name its host. Replacing a secret replaces its hosts."
          example:
            - langfuse.internal.example.com
      required:
        - name
        - value
    Source:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        provider:
          type: object
          properties:
            kind:
              type: string
              enum:
                - langfuse
                - langsmith
                - braintrust
                - posthog
                - phoenix
                - gradiated
            host:
              type:
                - string
                - "null"
            secret:
              type:
                - string
                - "null"
            project:
              type:
                - string
                - "null"
            filters:
              type: object
              additionalProperties: {}
          required:
            - kind
            - host
            - secret
            - project
            - filters
        schedule:
          type:
            - string
            - "null"
        next_sync_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When the schedule fires next (null without a schedule or while paused). After a failed sync the schedule
            backs off: twice its interval per consecutive failure, at most an hour."
        status:
          type: string
          enum:
            - active
            - paused
          description: "`paused` after 10 consecutive failed syncs: the schedule stops firing. A manual sync, or setting a new
            value for the source's secret, resumes it."
        paused_reason:
          type:
            - string
            - "null"
          description: Why the source is paused (null while active).
        last_error:
          type:
            - string
            - "null"
          description: The error of the last failed sync (provider keys redacted); cleared by a successful sync.
        last_error_at:
          type:
            - string
            - "null"
          format: date-time
        consecutive_failures:
          type: integer
          minimum: 0
          description: Failed syncs since the last successful one.
        pending_full:
          type: boolean
          description: A full sync was requested while another sync ran; it is queued as soon as that one ends.
        last_synced_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the last successful sync finished.
        last_sync:
          $ref: "#/components/schemas/SourceSync"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - workspace_id
        - dataset
        - provider
        - schedule
        - next_sync_at
        - status
        - paused_reason
        - last_error
        - last_error_at
        - consecutive_failures
        - pending_full
        - last_synced_at
        - last_sync
        - created_at
        - updated_at
      description: An observability provider synced into one dataset. A source feeds exactly one dataset; a dataset can have
        several sources. Deleting the dataset deletes its sources; removing a source keeps the dataset.
    SourceSync:
      type:
        - object
        - "null"
      properties:
        import_id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - queued
            - running
            - completed
            - failed
        full:
          type: boolean
        dataset_version:
          type:
            - integer
            - "null"
          minimum: 0
        error:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - import_id
        - status
        - full
        - dataset_version
        - error
        - created_at
        - finished_at
      description: The most recent sync, running or finished.
    CreateSourceRequest:
      type: object
      properties:
        provider:
          $ref: "#/components/schemas/SourceProvider"
        schedule:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 120
          description: Five-field cron in UTC (`*/15 * * * *`); minute resolution, so it fires at most once a minute (a seconds
            field is rejected). Leave it out to sync only on request.
      required:
        - provider
    SourceProvider:
      type: object
      properties:
        kind:
          type: string
          minLength: 1
          maxLength: 40
          description: One of langfuse, langsmith, braintrust, posthog, phoenix, gradiated; anything else is 422
            source_provider_unsupported.
          example: langfuse
        host:
          type:
            - string
            - "null"
          maxLength: 2048
          format: uri
          description: The provider's API host (https). Optional for providers with one public host; not used by 'gradiated'.
        secret:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
          description: Name of the workspace secret holding the provider key. Not used by 'gradiated'.
        project:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 200
          description: The provider project to read. Required for braintrust (project id or name) and posthog (numeric project
            id); optional elsewhere (LangSmith project, Phoenix project).
        filters:
          type: object
          additionalProperties: {}
          description: "Provider-specific filters passed to the fetcher, for example `{\"tags\": [\"prod\"]}` or, for 'gradiated',
            `{\"models\": [...], \"tasks\": [...]}`."
      required:
        - kind
    SyncSourceRequest:
      type: object
      properties:
        full:
          type: boolean
          default: false
          description: Rebuild the dataset from the provider as a new version (ignores the stored watermark).
    SourcePageResponse:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
            additionalProperties: {}
        cursor:
          type:
            - string
            - "null"
        has_more:
          type: boolean
      required:
        - records
        - cursor
        - has_more
    SourcePageRequest:
      type: object
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[A-Za-z0-9._:-]+$
        attempt:
          type: integer
          minimum: 1
        cursor:
          type:
            - string
            - "null"
          maxLength: 4096
          default: null
      required:
        - worker_id
        - attempt
  parameters:
    IdempotencyKey:
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
      required: false
      description: "Up to 255 visible ASCII characters (SDKs send a UUIDv4 and reuse it across retries). A create retried with
        the same key and body returns what the first request created, with `Idempotent-Replayed: true`; the same key
        with a different body is rejected with 422 `idempotency_key_reused`. The key is stored on the created resource,
        in the same transaction."
      name: Idempotency-Key
      in: header
