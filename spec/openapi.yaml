        sample_scores:
          type: array
          items:
            type: number
        judge_model:
          type:
            - string
            - "null"
        record:
          $ref: "#/components/schemas/DatasetRecord"
      required:
        - task_id
        - model
        - score
        - passed
        - sample_scores
        - judge_model
        - record
    EnvWorkerRegister:
      type: object
      properties:
        name:
