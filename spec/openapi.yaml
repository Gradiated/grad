  /v1/sources/{id}/sync:
    post:
      operationId: syncSource
      summary: "Sync now: queue an import of new traces and scores (returns the running one if a sync is in progress)"
      description: A source starts at most one sync per minute. Within a minute of the last sync's start this returns that
        sync with a `Retry-After` header (seconds until a new one may start), so a retried or repeated call is safe. A
        full sync asked for while an incremental one is queued or running returns the running one and starts right after
        it (`pending_full` on the source). Syncing a paused source resumes it.
      tags: *a7
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 200
          required: true
          name: id
          in: path
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncSourceRequest"
      responses:
        "202":
          description: "The sync's import job: new, running, or the last one when it started under a minute ago."
          headers:
            Retry-After:
              schema:
                type: string
                description: Seconds until a new sync may start; set when the returned job is the last one, not a new one.
              required: false
