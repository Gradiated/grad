        samples:
          type: integer
          minimum: 1
        pass_threshold:
          type: number
          minimum: 0
          maximum: 1
        judge_models:
          type: array
          items:
            type: string
        summary:
          type: array
          items:
            $ref: "#/components/schemas/EvalModelSummary"
        results:
          type: array
          items:
            $ref: "#/components/schemas/EvalTaskOutcome"
        total_cost_usd:
          type: number
          minimum: 0
        created_at:
          type: string
          format: date-time
