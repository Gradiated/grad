openapi: 3.1.0
info:
  title: Gradiated Training & Serving API
  version: 0.2.0-alpha.1
components:
  schemas:
    IdempotencyKey:
      type: string
      pattern: ^[\x21-\x7e]{1,255}$
      description: "Up to 255 visible ASCII characters (SDKs send a UUIDv4 and reuse it across retries). A create retried with
        the same key and body returns what the first request created, with `Idempotent-Replayed: true`; the same key
        with a different body is rejected with 422 `idempotency_key_reused`. The key is stored on the created resource,
        in the same transaction."
      example: 5f0c8d1e-3b8a-4c39-9a4e-2f1f0b6f4a21
    TrainableModel:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        hf_repo:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 200
        family:
          type: string
          enum:
            - llm
            - encoder
        adapters:
          type: array
          items:
            type: string
            enum:
              - lora
              - prefix_kv
              - frozen_head
              - encoder_full
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/RecipeKind"
        default_for:
          type: array
          items:
            $ref: "#/components/schemas/RecipeKind"
        price_per_million_tokens_usd:
          type: number
          exclusiveMinimum: 0
        max_context_tokens:
          type: integer
          exclusiveMinimum: 0
        template_revision:
          type: string
          minLength: 1
        calibrated_lrs:
          type: object
          additionalProperties:
            type: number
            exclusiveMinimum: 0
      required:
        - id
        - hf_repo
        - family
        - adapters
        - recipes
        - default_for
        - price_per_million_tokens_usd
        - max_context_tokens
        - template_revision
        - calibrated_lrs
    RecipeKind:
      type: string
      enum:
        - sft
        - dpo
        - router
        - decision
        - cartridge
        - embedding
        - distill
        - reward
        - grpo
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 4000
        code:
          type: string
          minLength: 1
          maxLength: 80
        request_id:
          type: string
          minLength: 1
      required:
        - type
        - title
        - status
        - detail
        - code
        - request_id
    CreatedApiKey:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/ApiKey"
        secret:
          type: string
      required:
        - key
        - secret
    ApiKey:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        prefix:
          type: string
          minLength: 1
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        created_at:
          type: string
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - workspace_id
        - name
        - prefix
        - scopes
        - created_at
        - revoked_at
    ApiKeyScope:
      type: string
      enum:
        - admin
        - datasets:read
        - datasets:write
        - runs:read
        - runs:write
        - artifacts:read
        - artifacts:write
        - secrets:read
        - secrets:write
        - sources:read
        - sources:write
        - deployments:write
        - feedback:write
        - env:serve
    CreateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
          minItems: 1
      required:
        - name
        - scopes
    Dataset:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        version:
          type: integer
          minimum: 0
        record_count:
          type: integer
          minimum: 0
          description: "Records in the current version after merging: score updates fold into their records, and a full source
            sync restarts the count. A record pushed again with an id it already has counts again."
        metadata:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - workspace_id
        - name
        - version
        - record_count
        - metadata
        - created_at
        - updated_at
    CreateDatasetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        metadata:
          type: object
          additionalProperties: {}
      required:
        - name
    PushDatasetRequest:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/DatasetRecord"
          minItems: 1
          maxItems: 50000
        metadata:
          type: object
          additionalProperties: {}
      required:
        - records
    DatasetRecord:
      type: object
      properties:
        schema:
          type: string
          enum:
            - grad.trajectory/1
        id:
          type: string
          minLength: 1
          maxLength: 160
        session_id:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 160
        group_id:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 160
        role:
          type:
            - string
            - "null"
          enum:
            - chosen
            - rejected
            - anchor
            - positive
            - negative
            - desirable
            - undesirable
            - rollout
            - null
        source:
          type:
            - string
            - "null"
          maxLength: 80
        timestamp:
          type:
            - string
            - "null"
          maxLength: 64
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        tools:
          type: array
          items:
            type: object
            additionalProperties: {}
        input:
          $ref: "#/components/schemas/TrajectoryInput"
        output:
          $ref: "#/components/schemas/TrajectoryOutput"
        prompt:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
        completion:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
        chosen:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
        rejected:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
        query:
          type: string
        positive:
          type: string
        negatives:
          type: array
          items:
            type: string
        state: {}
        questions:
          type: object
          additionalProperties: {}
        expected_output: {}
        scores:
          type: object
          additionalProperties:
            type: number
        metrics:
          type: object
          additionalProperties:
            type: number
        metadata:
          type: object
          additionalProperties: {}
      additionalProperties: false
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
            - tool
        content:
          anyOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: {}
            - type: "null"
        tool_calls:
          type: array
          items:
            type: object
            additionalProperties: {}
        tool_call_id:
          type: string
        name:
          type: string
        train:
          type: boolean
      required:
        - role
      additionalProperties: {}
    TrajectoryInput:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        tools:
          type: array
          items:
            type: object
            additionalProperties: {}
        media:
          type: array
          items:
            type: object
            additionalProperties: {}
        features:
          type: object
          additionalProperties: {}
        payload: {}
      additionalProperties: {}
    TrajectoryOutput:
      type:
        - object
        - "null"
      properties:
        turns:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        payload: {}
      additionalProperties: {}
    DatasetRecordsPage:
      type: object
      properties:
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        version:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: "#/components/schemas/DatasetRecord"
        next_cursor:
          type:
            - string
            - "null"
          description: Pass back as `cursor` for the next page; null on the last page (every list endpoint).
      required:
        - dataset
        - version
        - total
        - data
        - next_cursor
    EvalRun:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        status:
          $ref: "#/components/schemas/EvalStatus"
        mode:
          $ref: "#/components/schemas/EvalMode"
        models:
          type: array
          items:
            type: string
        baseline:
          type:
            - string
            - "null"
        task_source:
          type: object
          properties:
            kind:
              type: string
              enum:
                - dataset
            dataset:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
            version:
              type: integer
              minimum: 0
          required:
            - kind
            - dataset
            - version
        rubric:
          type: array
          items:
            $ref: "#/components/schemas/EvalRubricItem"
        samples:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        max_tokens:
          type: integer
          minimum: 1
        pass_threshold:
          type: number
          minimum: 0
          maximum: 1
        judge_models:
          type: array
          items:
            type: string
        local_scorers:
          type: array
          items:
            type: string
        progress:
          type: object
          properties:
            total_outputs:
              type: integer
              minimum: 0
            generated:
              type: integer
              minimum: 0
            pending_local_scores:
              type: integer
              minimum: 0
          required:
            - total_outputs
            - generated
            - pending_local_scores
        summary:
          type: array
          items:
            $ref: "#/components/schemas/EvalModelSummary"
        total_cost_usd:
          type: number
          minimum: 0
        scored_dataset_version:
          type:
            - integer
            - "null"
          minimum: 1
          description: "Scoring jobs: the dataset version holding the new scores (the source version when every record was already
            scored); null until completed."
        error:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - workspace_id
        - name
        - status
        - mode
        - models
        - baseline
        - task_source
        - rubric
        - samples
        - temperature
        - max_tokens
        - pass_threshold
        - judge_models
        - local_scorers
        - progress
        - summary
        - total_cost_usd
        - scored_dataset_version
        - error
        - created_at
        - updated_at
        - completed_at
    EvalStatus:
      type: string
      enum:
        - queued
        - running
        - awaiting_scores
        - completed
        - failed
        - cancelled
    EvalMode:
      type: string
      enum:
        - eval
        - score
      description: "`eval` generates outputs from `models`; `score` (`dataset.score()`) grades each record's own output (model
        `record`) and writes the scores to the dataset's next version."
    EvalRubricItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Za-z0-9_.:-]+$
        kind:
          type: string
          enum:
            - regex
            - validator
            - code
            - judge
        weight:
          type: number
          exclusiveMinimum: 0
          default: 1
        pattern:
          type: string
          maxLength: 256
        flags:
          type: string
          maxLength: 4
          pattern: ^[imsu]*$
        validator:
          type: string
          enum:
            - json
            - non_empty
            - exact_match
            - final_number
            - choice
        model:
          type: string
          minLength: 1
          maxLength: 160
        prompt:
          type: string
          maxLength: 8000
        runtime:
          type: string
          enum:
            - local
          description: Code scorers always run in the SDK process (`local`); the eval waits in `awaiting_scores` until the SDK
            posts their scores.
      required:
        - name
        - kind
    EvalModelSummary:
      type: object
      properties:
        model:
          type: string
        overall:
          type: number
        ci_low:
          type: number
        ci_high:
          type: number
        pass_at_k:
          type: object
          additionalProperties:
            type: number
        vs_baseline:
          type:
            - object
            - "null"
          properties:
            delta:
              type: number
            ci_low:
              type: number
            ci_high:
              type: number
          required:
            - delta
            - ci_low
            - ci_high
        tasks:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0
        tokens_per_task:
          type: number
        cost_per_1k_tasks_usd:
          type:
            - number
            - "null"
      required:
        - model
        - overall
        - ci_low
        - ci_high
        - pass_at_k
        - vs_baseline
        - tasks
        - errors
        - tokens_per_task
        - cost_per_1k_tasks_usd
    ScoreDatasetRequest:
      type: object
      properties:
        rubric:
          type: array
          items:
            $ref: "#/components/schemas/EvalRubricItem"
          minItems: 1
          maxItems: 32
        version:
          type: integer
          minimum: 1
          description: "Dataset version to score (default: the current version)."
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
          description: Name of the scoring job (default `<dataset>-score`).
        limit:
          type: integer
          minimum: 1
          maximum: 100000
      required:
        - rubric
      additionalProperties: false
    FilterDatasetRequest:
      allOf:
        - $ref: "#/components/schemas/DatasetFilter"
        - type: object
          properties:
            version:
              type: integer
              minimum: 1
              description: "Source version to filter (default: the current version)."
            name:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
              description: "Name of the view. Default: `<dataset>-f-<hash of source, version and filter>`, so the same filter returns
                the same view."
    DatasetFilter:
      type: object
      properties:
        scores:
          type: object
          additionalProperties:
            anyOf:
              - type: string
                minLength: 1
                maxLength: 64
              - type: number
          description: 'Conditions on stored scores, `{name: "<op><number>"}` with op one of >=, <=, >, <, ==, != (a bare number
            means ==). A record without the score does not match.'
          example:
            resolved: ">=0.8"
        metadata:
          type: object
          additionalProperties:
            anyOf:
              - type: string
              - type: number
              - type: boolean
          description: Exact matches on `metadata` fields.
        created_after:
          anyOf:
            - type: string
              format: date-time
            - type: string
              format: date
          description: Records whose `timestamp` is at or after this time (a timestamp with offset, or a UTC date `YYYY-MM-DD`).
        created_before:
          anyOf:
            - type: string
              format: date-time
            - type: string
              format: date
          description: Records whose `timestamp` is before this time.
        ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 160
          maxItems: 200000
          description: Keep only these record ids (what the SDKs send for a filter function they ran locally).
    RenderDatasetResponse:
      type: object
      properties:
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        model:
          type: string
        template_revision:
          type: string
        token_counts:
          type: string
          enum:
            - estimated
          description: Token counts (total, trained and per span) are estimates (about 4 characters per token); the trainer
            tokenizes with the model's pinned tokenizer, and the run's metrics report the exact tokens.
        examples:
          type: array
          items:
            type: object
            properties:
              record_id:
                type: string
              template_revision:
                type: string
              total_tokens:
                type: integer
                minimum: 0
              trained_tokens:
                type: integer
                minimum: 0
              trained_fraction:
                type: number
                minimum: 0
                maximum: 1
              spans:
                type: array
                items:
                  type: object
                  properties:
                    text:
                      type: string
                    trained:
                      type: boolean
                    tokens:
                      type: integer
                      minimum: 0
                  required:
                    - text
                    - trained
                    - tokens
            required:
              - record_id
              - template_revision
              - total_tokens
              - trained_tokens
              - trained_fraction
              - spans
      required:
        - dataset
        - model
        - template_revision
        - token_counts
        - examples
    RenderDatasetRequest:
      type: object
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 160
          default: qwen/qwen3-8b
        train_on:
          type: string
          enum:
            - last
            - all_assistant
          default: last
        thinking:
          type: string
          enum:
            - auto
            - on
            - off
          default: auto
        preserve_thinking:
          type: boolean
          default: false
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
    UploadTicket:
      type: object
      properties:
        upload_id:
          type: string
          minLength: 1
          description: "The file's sha256: uploads are content-addressed, so re-uploading the same bytes is harmless."
        method:
          type: string
          enum:
            - PUT
        url:
          type: string
          minLength: 1
          description: Absolute presigned URL, or a path relative to the API base URL (local storage).
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
      required:
        - upload_id
        - method
        - url
        - headers
        - expires_at
    CreateUploadRequest:
      type: object
      properties:
        purpose:
          type: string
          enum:
            - dataset_import
        filename:
          type: string
          minLength: 1
          maxLength: 255
        size_bytes:
          type: integer
          minimum: 1
          maximum: 5368709120
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - purpose
        - filename
        - size_bytes
        - sha256
    ImportJob:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        status:
          $ref: "#/components/schemas/ImportStatus"
        source:
          type: object
          additionalProperties: {}
        connector:
          type: string
          enum:
            - auto
            - grad_trajectories
            - openai_chat
            - gradiated
            - otel
            - langfuse
            - posthog
            - braintrust
            - langsmith
        attempt:
          type: integer
          minimum: 0
        imported_count:
          type: integer
          minimum: 0
          description: Records this import added to the dataset (score updates for existing records add none).
        dropped_count:
          type: integer
          minimum: 0
        detected_scores:
          type: array
          items:
            type: string
        drop_reasons:
          type: array
          items:
            type: string
          description: "Why rows were dropped, one line per row (`line 12: invalid JSON`), capped at 100 entries."
        dataset_version:
          type:
            - integer
            - "null"
          minimum: 0
        error:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - workspace_id
        - dataset
        - status
        - source
        - connector
        - attempt
        - imported_count
        - dropped_count
        - detected_scores
        - drop_reasons
        - dataset_version
        - error
        - created_at
        - updated_at
    ImportStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
    CreateImportRequest:
      type: object
      properties:
        source:
          $ref: "#/components/schemas/ImportSource"
        connector:
          type: string
          enum:
            - auto
            - grad_trajectories
            - openai_chat
            - gradiated
            - otel
            - langfuse
            - posthog
            - braintrust
            - langsmith
          default: auto
      required:
        - source
    ImportSource:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - upload
            upload_id:
              type: string
              minLength: 1
              maxLength: 160
            format:
              type: string
              enum:
                - auto
                - jsonl
                - json
                - parquet
              default: auto
          required:
            - kind
            - upload_id
        - type: object
          properties:
            kind:
              type: string
              enum:
                - hf
            repo:
              type: string
              minLength: 1
              maxLength: 200
              pattern: ^[A-Za-z0-9](?:[\w-]|\.(?!\.))*(\/[A-Za-z0-9](?:[\w-]|\.(?!\.))*)?$
            split:
              type: string
              minLength: 1
              maxLength: 64
              default: train
            config:
              type: string
              minLength: 1
              maxLength: 128
            revision:
              type: string
              minLength: 1
              maxLength: 128
            columns:
              $ref: "#/components/schemas/HfColumnMapping"
            limit:
              type: integer
              minimum: 1
              maximum: 10000000
            secret:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
              description: Name of a workspace secret holding a Hugging Face token, for gated or private datasets. The worker receives
                the token at claim time.
          required:
            - kind
            - repo
        - type: object
          properties:
            kind:
              type: string
              enum:
                - benchmark
            benchmark:
              type: string
              enum:
                - gsm8k
                - mmlu
                - mmlu_pro
                - arc_challenge
              description: A built-in benchmark, imported from Hugging Face at a pinned revision with fixed prompts; evals on the
                dataset default to its answer check.
            limit:
              type: integer
              minimum: 1
              maximum: 10000000
