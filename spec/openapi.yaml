openapi: 3.1.0
info:
  title: Gradiated Training & Serving API
  version: 0.1.0
components:
  schemas:
    TrainableModel:
      type: object
      properties:
        id:
          type: string
        adapters:
          type: array
          items:
            type: string
        default_for:
          type: array
          items:
            $ref: "#/components/schemas/RecipeKind"
        price_per_million_tokens_usd:
          type: number
          exclusiveMinimum: 0
        max_context_tokens:
          type: integer
          exclusiveMinimum: 0
        template_revision:
          type: string
        calibrated_lrs:
          type: object
          additionalProperties:
            type: number
            exclusiveMinimum: 0
      required:
        - id
        - adapters
        - default_for
        - price_per_million_tokens_usd
        - max_context_tokens
        - template_revision
        - calibrated_lrs
    RecipeKind:
      type: string
      enum:
        - sft
        - dpo
        - router
        - decision
        - cartridge
        - embedding
        - distill
        - reward
        - grpo
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 2000
        code:
          type: string
          minLength: 1
          maxLength: 80
        request_id:
          type: string
          minLength: 1
      required:
        - type
        - title
        - status
        - detail
        - code
        - request_id
    ApiKey:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        prefix:
          type: string
          minLength: 1
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        created_at:
          type: string
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - workspace_id
        - name
        - prefix
        - scopes
        - created_at
        - revoked_at
    ApiKeyScope:
      type: string
      enum:
        - admin
        - datasets:read
        - datasets:write
        - runs:read
        - runs:write
        - artifacts:read
        - artifacts:write
        - deployments:write
        - feedback:write
        - env:serve
        - trainer:worker
    CreateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
          minItems: 1
      required:
        - name
        - scopes
    Dataset:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        record_count:
          type: integer
          minimum: 0
        storage_key:
          type: string
          minLength: 1
        metadata:
          type: object
          additionalProperties: {}
          default: {}
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - workspace_id
        - name
        - record_count
        - storage_key
        - created_at
        - updated_at
    PushDatasetRequest:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/DatasetRecord"
          minItems: 1
          maxItems: 50000
        metadata:
          type: object
          additionalProperties: {}
      required:
        - records
    DatasetRecord:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        session_id:
          type: string
          minLength: 1
          maxLength: 160
        group_id:
          type: string
          minLength: 1
          maxLength: 160
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        tools:
          type: array
          items:
            type: object
            additionalProperties: {}
        prompt:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
        chosen:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
        rejected:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
        query:
          type: string
        positive:
          type: string
        negatives:
          type: array
          items:
            type: string
        state: {}
        questions:
          type: object
          additionalProperties: {}
        expected_output: {}
        scores:
          type: object
          additionalProperties:
            type: number
        metrics:
          type: object
          additionalProperties:
            type: number
        metadata:
          type: object
          additionalProperties: {}
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
            - tool
        content:
          type:
            - string
            - "null"
        tool_calls:
          type: array
          items:
            type: object
            additionalProperties: {}
        tool_call_id:
          type: string
        name:
          type: string
        train:
          type: boolean
      required:
        - role
    RenderDatasetResponse:
      type: object
      properties:
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        model:
          type: string
        template_revision:
          type: string
        examples:
          type: array
          items:
            type: object
            properties:
              record_id:
                type: string
              template_revision:
                type: string
              total_tokens:
                type: integer
                minimum: 0
              trained_tokens:
                type: integer
                minimum: 0
              trained_fraction:
                type: number
                minimum: 0
                maximum: 1
              spans:
                type: array
                items:
                  type: object
                  properties:
                    text:
                      type: string
                    trained:
                      type: boolean
                    tokens:
                      type: integer
                      minimum: 0
                  required:
                    - text
                    - trained
                    - tokens
            required:
              - record_id
              - template_revision
              - total_tokens
              - trained_tokens
              - trained_fraction
              - spans
      required:
        - dataset
        - model
        - template_revision
        - examples
    RenderDatasetRequest:
      type: object
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 160
          default: qwen/qwen3-8b
        train_on:
          type: string
          enum:
            - last
            - all_assistant
          default: last
        thinking:
          type: string
          enum:
            - auto
            - on
            - off
          default: auto
        preserve_thinking:
          type: boolean
          default: false
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
    PlanRunResponse:
      type: object
      properties:
        resolved_config:
          $ref: "#/components/schemas/ResolvedRunConfig"
        estimated_steps:
          type: integer
          minimum: 0
        estimated_tokens:
          type: integer
          minimum: 0
        estimated_cost_usd:
          type: number
          minimum: 0
        trained_token_fraction:
          type: number
          minimum: 0
          maximum: 1
        warnings:
          type: array
          items:
            type: string
      required:
        - resolved_config
        - estimated_steps
        - estimated_tokens
        - estimated_cost_usd
        - trained_token_fraction
        - warnings
    ResolvedRunConfig:
      type: object
      properties:
        rule_version:
          type: string
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        recipe_kind:
          $ref: "#/components/schemas/RecipeKind"
        model:
          type: string
        template_revision:
          type: string
        adapter:
          anyOf:
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - lora
                rank:
                  type: integer
                  minimum: 1
                  maximum: 256
                  default: 32
                alpha:
                  type: integer
                  minimum: 1
                  maximum: 512
                  default: 32
                merge_on_export:
                  type: boolean
                  default: false
              required:
                - kind
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - prefix_kv
                num_tokens:
                  type: integer
                  minimum: 16
                  maximum: 4096
                  default: 256
              required:
                - kind
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - frozen_head
              required:
                - kind
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - encoder_full
              required:
                - kind
        lr:
          type: number
          exclusiveMinimum: 0
        lr_source:
          type: string
        batch_size:
          type: integer
          minimum: 1
        epochs:
          type: integer
          minimum: 1
        schedule:
          type: string
          enum:
            - linear
            - cosine
            - constant
        warmup:
          type: number
        train_on:
          type: string
          enum:
            - last
            - all_assistant
        thinking:
          type: string
          enum:
            - auto
            - on
            - off
        preserve_thinking:
          type: boolean
        reduction:
          type: string
          enum:
            - per_example
            - per_token
        select:
          type: string
          enum:
            - best
            - last
        checkpoint_every_steps:
          type: integer
          minimum: 1
        checkpoint_ttl_days:
          type: integer
          minimum: 1
        split:
          type: object
          properties:
            strategy:
              type: string
              enum:
                - by_session
                - by_group
                - random
            eval_fraction:
              type: number
            seed:
              type: integer
            train_records:
              type: integer
              minimum: 0
            eval_records:
              type: integer
              minimum: 0
          required:
            - strategy
            - eval_fraction
            - seed
            - train_records
            - eval_records
        recipe_params:
          type: object
          additionalProperties: {}
      required:
        - rule_version
        - dataset
        - name
        - recipe_kind
        - model
        - template_revision
        - adapter
        - lr
        - lr_source
        - batch_size
        - epochs
        - schedule
        - warmup
        - train_on
        - thinking
        - preserve_thinking
        - reduction
        - select
        - checkpoint_every_steps
        - checkpoint_ttl_days
        - split
        - recipe_params
    PlanRunRequest:
      type: object
      properties:
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        recipe:
          $ref: "#/components/schemas/RecipeSpec"
        split:
          $ref: "#/components/schemas/SplitSpec"
        max_cost_usd:
          type: number
          exclusiveMinimum: 0
      required:
        - dataset
        - name
        - recipe
    RecipeSpec:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/RecipeKind"
        model:
          type: string
          minLength: 1
          maxLength: 160
        adapter:
          $ref: "#/components/schemas/AdapterSpec"
        lr:
          anyOf:
            - type: string
              enum:
                - auto
            - type: number
              exclusiveMinimum: 0
          default: auto
        lr_scale:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          default: 1
        batch_size:
          type: integer
          minimum: 1
          maximum: 4096
        epochs:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
        schedule:
          type: string
          enum:
            - linear
            - cosine
            - constant
          default: linear
        warmup:
          type: number
          minimum: 0
          maximum: 0.5
          default: 0.03
        train_on:
          type: string
          enum:
            - last
            - all_assistant
          default: last
        thinking:
          type: string
          enum:
            - auto
            - on
            - off
          default: auto
        preserve_thinking:
          type: boolean
          default: false
        reduction:
          type: string
          enum:
            - per_example
            - per_token
          default: per_example
        select:
          type: string
          enum:
            - best
            - last
          default: best
        checkpoint_ttl_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        beta:
          type: number
          exclusiveMinimum: 0
        models:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 160
        max_quality_drop:
          type: number
          minimum: 0
          maximum: 0.5
        context_text:
          type: string
        context_uri:
          type: string
        num_tokens:
          type: integer
          minimum: 16
          maximum: 4096
        temp:
          type: number
          exclusiveMinimum: 0
        teacher:
          type: string
          minLength: 1
          maxLength: 160
        env_name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        group_size:
          type: integer
          minimum: 2
          maximum: 64
      required:
        - kind
    AdapterSpec:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - lora
            rank:
              type: integer
              minimum: 1
              maximum: 256
              default: 32
            alpha:
              type: integer
              minimum: 1
              maximum: 512
              default: 32
            merge_on_export:
              type: boolean
              default: false
          required:
            - kind
        - type: object
          properties:
            kind:
              type: string
              enum:
                - prefix_kv
            num_tokens:
              type: integer
              minimum: 16
              maximum: 4096
              default: 256
          required:
            - kind
        - type: object
          properties:
            kind:
              type: string
              enum:
                - frozen_head
          required:
            - kind
    SplitSpec:
      type: object
      properties:
        strategy:
          type: string
          enum:
            - by_session
            - by_group
            - random
          default: by_session
        eval_fraction:
          type: number
          minimum: 0
          maximum: 0.5
        seed:
          type: integer
          default: 42
    Run:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        dataset_id:
          type: string
          minLength: 1
        dataset_name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        recipe_kind:
          $ref: "#/components/schemas/RecipeKind"
        status:
          $ref: "#/components/schemas/RunStatus"
        resolved_config:
          $ref: "#/components/schemas/ResolvedRunConfig"
        max_cost_usd:
          type:
            - number
            - "null"
          exclusiveMinimum: 0
        tokens_processed:
          type: integer
          minimum: 0
        cost_usd:
          type: number
          minimum: 0
        current_step:
          type: integer
          minimum: 0
        total_steps:
          type: integer
          minimum: 0
        metrics_history:
          type: array
          items:
            $ref: "#/components/schemas/MetricPoint"
        eval_report:
          type:
            - object
            - "null"
          additionalProperties: {}
        artifact_id:
          type:
            - string
            - "null"
        error:
          type:
            - string
            - "null"
        worker_id:
          type:
            - string
            - "null"
        lease_expires_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - workspace_id
        - name
        - dataset_id
        - dataset_name
        - recipe_kind
        - status
        - resolved_config
        - max_cost_usd
        - tokens_processed
        - cost_usd
        - current_step
        - total_steps
        - metrics_history
        - eval_report
        - artifact_id
        - error
        - worker_id
        - lease_expires_at
        - created_at
        - updated_at
    RunStatus:
      type: string
      enum:
        - queued
        - running
        - paused
        - completed
        - failed
        - cancelled
        - stopped_budget
    MetricPoint:
      type: object
      properties:
        step:
          type: integer
          minimum: 0
        loss:
          type: number
        eval_loss:
          type: number
        eval_metric:
          type: number
        grad_norm:
          type: number
        lr:
          type: number
        tokens_per_sec:
          type: number
        tokens:
          type: integer
          minimum: 0
        cost_usd:
          type: number
          minimum: 0
        timestamp:
          type: string
          format: date-time
      required:
        - step
        - loss
        - tokens
        - cost_usd
        - timestamp
    ResumeRunRequest:
      type: object
      properties:
        max_cost_usd:
          type: number
          exclusiveMinimum: 0
    Checkpoint:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        run_id:
          type: string
          minLength: 1
        step:
          type: integer
          minimum: 0
        eval_score:
          type:
            - number
            - "null"
        storage_key:
          type: string
          minLength: 1
        sha256:
          type: string
          minLength: 64
          maxLength: 64
        size_bytes:
          type: integer
          minimum: 0
        metadata:
          type: object
          additionalProperties: {}
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
        - id
        - workspace_id
        - run_id
        - step
        - eval_score
        - storage_key
        - sha256
        - size_bytes
        - metadata
        - expires_at
        - created_at
    Artifact:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        version:
          type: string
          minLength: 1
        run_id:
          type:
            - string
            - "null"
        checkpoint_id:
          type:
            - string
            - "null"
        base_model:
          type: string
          minLength: 1
        recipe_kind:
          $ref: "#/components/schemas/RecipeKind"
        format:
          $ref: "#/components/schemas/ArtifactFormat"
        storage_key:
          type: string
          minLength: 1
        sha256:
          type: string
          minLength: 64
          maxLength: 64
        size_bytes:
          type: integer
          minimum: 0
        manifest:
          type: object
          additionalProperties: {}
        eval_report:
          type:
            - object
            - "null"
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
      required:
        - id
        - workspace_id
        - name
        - version
        - run_id
        - checkpoint_id
        - base_model
        - recipe_kind
        - format
        - storage_key
        - sha256
        - size_bytes
        - manifest
        - eval_report
        - created_at
    ArtifactFormat:
      type: string
      enum:
        - peft_lora
        - cartridge
        - encoder_safetensors
        - router_bundle
        - decision_bundle
    PromoteCheckpointRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
    ClaimJobRequest:
      type: object
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 160
        lease_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 180
      required:
        - worker_id
    ReportRunProgress:
      type: object
      properties:
        worker_id:
          type: string
          minLength: 1
        metric:
          $ref: "#/components/schemas/MetricPoint"
        lease_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 180
      required:
        - worker_id
        - metric
    RegisterCheckpointRequest:
      type: object
      properties:
        worker_id:
          type: string
          minLength: 1
        step:
          type: integer
          minimum: 0
        eval_score:
          type:
            - number
            - "null"
        payload_base64:
          type: string
          minLength: 1
          maxLength: 33554432
        metadata:
          type: object
          additionalProperties: {}
          default: {}
      required:
        - worker_id
        - step
        - payload_base64
    CompleteRunRequest:
      type: object
      properties:
        worker_id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - completed
            - failed
            - stopped_budget
        format:
          $ref: "#/components/schemas/ArtifactFormat"
        artifact_base64:
          type: string
          minLength: 1
          maxLength: 33554432
        manifest:
          type: object
          additionalProperties: {}
        eval_report:
          type: object
          additionalProperties: {}
        tokens_processed:
          type: integer
          minimum: 0
        cost_usd:
          type: number
          minimum: 0
        error:
          type: string
          maxLength: 4000
      required:
        - worker_id
        - status
    Deployment:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        model_id:
          type: string
          minLength: 1
        active_artifact_id:
          type: string
          minLength: 1
        previous_artifact_id:
          type:
            - string
            - "null"
        fallback_model:
          type:
            - string
            - "null"
        explore_rate:
          type: number
          minimum: 0
          maximum: 0.5
        status:
          type: string
          enum:
            - active
            - disabled
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - workspace_id
        - name
        - model_id
        - active_artifact_id
        - previous_artifact_id
        - fallback_model
        - explore_rate
        - status
        - created_at
        - updated_at
    DeployArtifactRequest:
      type: object
      properties:
        artifact:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        fallback:
          type: string
          minLength: 1
