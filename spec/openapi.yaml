    MetricsPage:
      type: object
      properties:
        run_id:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        data:
          type: array
          items:
            $ref: "#/components/schemas/MetricPoint"
        next_cursor:
          type:
            - string
            - "null"
          description: Pass back as `cursor` for the next page; null on the last page (every list endpoint).
        tail_cursor:
          type: string
          description: Cursor after the newest point returned so far; pass it back as `cursor` to poll for points written later
            (tailing a running run).
      required:
        - run_id
        - status
        - data
        - next_cursor
        - tail_cursor
    RunEventsPage:
      type: object
      properties:
        run_id:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        data:
          type: array
          items:
            $ref: "#/components/schemas/RunEvent"
        next_cursor:
          type:
            - string
            - "null"
          description: Pass back as `cursor` for the next page; null on the last page (every list endpoint).
        tail_cursor:
          type: string
          description: Cursor after the newest event returned so far; pass it back as `cursor` to poll for later events.
      required:
        - run_id
        - status
        - data
        - next_cursor
        - tail_cursor
    RunEvent:
      oneOf:
        - $ref: "#/components/schemas/PhaseEvent"
        - $ref: "#/components/schemas/MetricEvent"
        - $ref: "#/components/schemas/CheckpointEvent"
        - $ref: "#/components/schemas/AttemptEvent"
        - $ref: "#/components/schemas/WarningEvent"
        - $ref: "#/components/schemas/LogEvent"
        - $ref: "#/components/schemas/CompletedEvent"
      discriminator:
        propertyName: type
        mapping:
          phase: "#/components/schemas/PhaseEvent"
          metric: "#/components/schemas/MetricEvent"
          checkpoint: "#/components/schemas/CheckpointEvent"
          attempt: "#/components/schemas/AttemptEvent"
          warning: "#/components/schemas/WarningEvent"
          log: "#/components/schemas/LogEvent"
          completed: "#/components/schemas/CompletedEvent"
      description: One event of a run's lifecycle, discriminated by `type`. `completed` is always last.
    PhaseEvent:
      type: object
      properties:
        type:
          type: string
          enum:
            - phase
        run_id:
          type: string
          minLength: 1
        seq:
          type: integer
          minimum: 0
          description: Position in the run's event sequence (the SSE event id; pass it as Last-Event-ID or `cursor` to resume).
            `completed` repeats the last stored seq.
        attempt:
          type: integer
          minimum: 1
        timestamp:
          type: string
          format: date-time
        phase:
          $ref: "#/components/schemas/RunPhase"
        step:
          type: integer
          minimum: 0
          description: Training step when the phase began (0 before training; the resume step on a resumed attempt).
        workers_online:
          type:
            - integer
            - "null"
          minimum: 0
          description: "queued and waiting_for_compute: workers of this job kind holding a lease (all busy; an idle worker would
            have claimed the run)."
        autoscaling:
          type:
            - boolean
            - "null"
          description: "queued and waiting_for_compute: true when workers scale from zero (KEDA), so one is starting rather than
            missing."
        gpu:
          $ref: "#/components/schemas/GpuInfo"
      required:
        - type
        - run_id
        - seq
        - attempt
        - timestamp
        - phase
        - step
        - workers_online
        - autoscaling
        - gpu
    RunPhase:
      type: string
      enum:
        - queued
        - waiting_for_compute
        - starting
        - loading_model
        - training
        - evaluating
        - checkpointing
        - uploading
        - completing
      description: "Where a run is in its lifecycle (on a Run: the latest phase; once the run is terminal, status is
        authoritative and phase is the last one reached). queued, waiting_for_compute (queued for longer than the
        server's threshold with no worker claiming it) and starting (a worker claimed it) come from the server; the
        worker reports the rest. training, evaluating and checkpointing repeat."
    GpuInfo:
      type:
        - object
        - "null"
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        memory_gb:
          type: number
          minimum: 0
          maximum: 100000
      required:
        - name
        - memory_gb
      description: "starting: the claiming worker's GPU (null without one, e.g. the reference backend). Never the worker id or
        host."
    MetricEvent:
      type: object
      properties:
        type:
          type: string
          enum:
            - metric
        run_id:
          type: string
          minLength: 1
        seq:
          type: integer
          minimum: 0
          description: Position in the run's event sequence (the SSE event id; pass it as Last-Event-ID or `cursor` to resume).
            `completed` repeats the last stored seq.
        attempt:
          type: integer
          minimum: 1
        timestamp:
          type: string
          format: date-time
        step:
          type: integer
          minimum: 0
        metric:
