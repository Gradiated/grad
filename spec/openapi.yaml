          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        recipe_kind:
          $ref: "#/components/schemas/RecipeKind"
        model:
          type: string
        template_revision:
