        - encoder_safetensors
        - router_bundle
        - decision_bundle
        - reward_bundle
        - reference
        - null
      description: Artifact format when this checkpoint is exportable (promotable); null for training state only.
    AttemptEvent:
      type: object
      properties:
        type:
          type: string
          enum:
            - attempt
        run_id:
          type: string
          minLength: 1
        seq:
          type: integer
          minimum: 0
          description: Position in the run's event sequence (the SSE event id; pass it as Last-Event-ID or `cursor` to resume).
            `completed` repeats the last stored seq.
        attempt:
          type: integer
          minimum: 1
        timestamp:
          type: string
          format: date-time
        event:
          type: string
          enum:
            - started
            - interrupted
            - gave_up
          description: "started: a worker claimed attempt N (resume_step: the checkpoint it resumes from). interrupted: attempt N
            ended without a result at `step` (resume_step: where the next attempt resumes). gave_up: no attempts left;
            the run failed."
        reason:
