        - name
        - status
        - models
        - baseline
        - task_source
        - rubric
        - samples
        - pass_threshold
        - judge_models
        - summary
        - results
        - total_cost_usd
        - created_at
    EvalModelSummary:
      type: object
      properties:
        model:
          type: string
        overall:
          type: number
        ci_low:
          type: number
        ci_high:
          type: number
        pass_at_k:
          type: object
          additionalProperties:
            type: number
        vs_baseline:
          type:
            - object
            - "null"
          properties:
            delta:
              type: number
            ci_low:
              type: number
            ci_high:
              type: number
          required:
            - delta
            - ci_low
            - ci_high
        tokens_per_task:
          type: number
        cost_per_1k_tasks_usd:
          type: number
      required:
        - model
        - overall
        - ci_low
        - ci_high
        - pass_at_k
        - vs_baseline
        - tokens_per_task
        - cost_per_1k_tasks_usd
    EvalTaskOutcome:
