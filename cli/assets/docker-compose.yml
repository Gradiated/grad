# Local grad stack used by `grad local up` (embedded in the grad binary).
# Published images from Docker Hub (ghcr.io/gradiated mirrors the same tags); the API
# listens on 127.0.0.1 only. `grad local up` sets
# GRAD_ADMIN_API_KEY_HASH / GRAD_TRAINER_API_KEY / GRAD_S3_* from the 'local'
# profile so authentication is on. Override images with GRAD_SERVER_IMAGE / GRAD_TRAINER_IMAGE.
name: grad-local

services:
  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_USER: grad
      POSTGRES_PASSWORD: ${GRAD_POSTGRES_PASSWORD:-grad_local_dev_only}
      POSTGRES_DB: grad
    mem_limit: ${GRAD_POSTGRES_MEMORY:-1g}
    # Not published: only grad-server talks to it, over the compose network.
    volumes:
      - grad-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grad -d grad"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3 storage: SeaweedFS in single-node mode, like the S3 bucket Helm uses.
  # Its S3 port is published on loopback only, because the CLI and SDKs PUT
  # files to presigned URLs. The key is in the generated config below; it
  # refuses to start without one (start the stack with `grad local up`).
  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    entrypoint:
      - /bin/sh
      - -c
      - >-
        if grep -q '"secretKey": ""' /etc/seaweedfs/s3.json; then
        echo 'no S3 key (GRAD_S3_SECRET_KEY): start the stack with grad local up' >&2; exit 1; fi;
        exec /entrypoint.sh "$$@"
      - seaweedfs
    command:
      - mini
      - -dir=/data
      - -s3.config=/etc/seaweedfs/s3.json
      - -bucket=grad
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -master.telemetry=false
    configs:
      - source: grad-s3
        target: /etc/seaweedfs/s3.json
    mem_limit: ${GRAD_S3_MEMORY:-512m}
    ports:
      - "127.0.0.1:${GRAD_S3_PORT:-18786}:8333"
    volumes:
      - grad-s3:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz && wget -q -O /dev/null http://127.0.0.1:8888/buckets/grad/"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Applies database migrations once, then exits (the Helm chart's migrations Job).
  migrate:
    image: ${GRAD_SERVER_IMAGE:-docker.io/gradiated/grad-server:__GRAD_VERSION__}
    command: ["node", "dist/main.js", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://grad:${GRAD_POSTGRES_PASSWORD:-grad_local_dev_only}@postgres:5432/grad"
    mem_limit: 256m
    restart: "no"

  grad-server:
    image: ${GRAD_SERVER_IMAGE:-docker.io/gradiated/grad-server:__GRAD_VERSION__}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      DATABASE_URL: "postgres://grad:${GRAD_POSTGRES_PASSWORD:-grad_local_dev_only}@postgres:5432/grad"
      AUTH_MODE: "${GRAD_AUTH_MODE:-api_key}"
      ADMIN_API_KEY_HASH: "${GRAD_ADMIN_API_KEY_HASH:-}"
      TRAINER_API_KEY: "${GRAD_TRAINER_API_KEY:-}"
      # Encrypts workspace secrets (32 random bytes, base64); `grad local up` generates it.
      GRAD_SECRETS_KEY: "${GRAD_SECRETS_KEY:-}"
      # Evals run on grad-eval-worker; the API only checks an endpoint is set.
      GRAD_INFERENCE_BASE_URL: "${GRAD_INFERENCE_BASE_URL:-}"
      GRAD_JUDGE_BASE_URL: "${GRAD_JUDGE_BASE_URL:-}"
      # Priced judge models beyond the catalog, e.g. [{"id":"...","price_per_million_tokens_usd":3}].
      GRAD_JUDGE_MODELS_JSON: "${GRAD_JUDGE_MODELS_JSON:-}"
      # S3 storage (the seaweedfs service): the same variables Helm sets.
      S3_BUCKET: "grad"
      S3_REGION: "us-east-1"
      S3_ENDPOINT: "http://seaweedfs:8333"
      # Upload tickets for the CLI and SDKs on this machine use the loopback port.
      S3_PUBLIC_ENDPOINT: "http://127.0.0.1:${GRAD_S3_PORT:-18786}"
      AWS_ACCESS_KEY_ID: "${GRAD_S3_ACCESS_KEY:-}"
      AWS_SECRET_ACCESS_KEY: "${GRAD_S3_SECRET_KEY:-}"
      # The migrate service applied them.
      MIGRATE_ON_BOOT: "false"
    mem_limit: ${GRAD_SERVER_MEMORY:-1g}
    ports:
      - "127.0.0.1:${GRAD_PORT:-18787}:8787"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Runs evals, dataset.score() and router labelling (the grad-server image):
  # it calls the inference and judge endpoints and posts outputs to the API.
  grad-eval-worker:
    image: ${GRAD_SERVER_IMAGE:-docker.io/gradiated/grad-server:__GRAD_VERSION__}
    command: ["node", "dist/main.js", "worker", "--kinds", "eval"]
    depends_on:
      grad-server:
        condition: service_healthy
    environment:
      GRAD_SERVER_URL: "http://grad-server:8787"
      TRAINER_API_KEY: "${GRAD_TRAINER_API_KEY:-}"
      GRAD_WORKER_ID: "local-eval-worker"
      GRAD_INFERENCE_BASE_URL: "${GRAD_INFERENCE_BASE_URL:-}"
      GRAD_INFERENCE_API_KEY: "${GRAD_INFERENCE_API_KEY:-}"
      GRAD_JUDGE_BASE_URL: "${GRAD_JUDGE_BASE_URL:-}"
      GRAD_JUDGE_API_KEY: "${GRAD_JUDGE_API_KEY:-}"
      EVAL_CONCURRENCY: "${GRAD_EVAL_CONCURRENCY:-8}"
    # No HTTP server: the image's API healthcheck doesn't apply.
    healthcheck:
      disable: true
    mem_limit: ${GRAD_EVAL_WORKER_MEMORY:-512m}
    # On SIGTERM it posts the outputs in flight and hands the eval back.
    stop_grace_period: 30s
    restart: unless-stopped

  grad-trainer:
    image: ${GRAD_TRAINER_IMAGE:-docker.io/gradiated/grad-trainer:__GRAD_VERSION__}
    depends_on:
      grad-server:
        condition: service_healthy
    environment:
      GRAD_SERVER_URL: "http://grad-server:8787"
      TRAINER_API_KEY: "${GRAD_TRAINER_API_KEY:-}"
      GRAD_WORKER_ID: "local-cpu-trainer"
      GRAD_POLL_INTERVAL_S: "1.0"
      GRAD_WORKER_METRICS_PORT: "9465"
      # Sources on this machine (a local Langfuse): --host http://host.docker.internal:PORT,
      # with these CIDRs exported before `grad local up` (e.g. 172.16.0.0/12).
      GRAD_SOURCES_EGRESS_ALLOW: "${GRAD_SOURCES_EGRESS_ALLOW:-}"
    mem_limit: ${GRAD_TRAINER_MEMORY:-8g}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # On SIGTERM the worker releases its attempt (billed, requeued, resumed from the latest checkpoint).
    stop_grace_period: 2m
    # Downloaded base weights survive restarts.
    volumes:
      - grad-hf-cache:/home/grad/.cache/huggingface
    restart: unless-stopped

  # `grad local up --dev-models`: a CPU OpenAI-compatible endpoint for evals (the
  # trainer image): the dev models, artifacts trained on them and the test/tiny-judge
  # judge. Not published: only the eval worker calls it, over the compose network.
  grad-dev-inference:
    profiles: ["dev-models"]
    image: ${GRAD_TRAINER_IMAGE:-docker.io/gradiated/grad-trainer:__GRAD_VERSION__}
    command: ["grad-dev-inference"]
    environment:
      GRAD_SERVER_URL: "http://grad-server:8787"
      # Reads the artifacts it serves (`grad local up` passes the local profile's key).
      GRADIATED_API_KEY: "${GRAD_DEV_INFERENCE_API_KEY:-}"
      GRAD_DEV_MODELS: "1"
      GRAD_DEV_INFERENCE_HOST: "0.0.0.0"
      GRAD_TORCH_THREADS: "2"
      HF_HUB_OFFLINE: "1"
    mem_limit: ${GRAD_DEV_INFERENCE_MEMORY:-1g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    # The dev models' weights, shared with the CPU trainer.
    volumes:
      - grad-hf-cache:/home/grad/.cache/huggingface
    stop_grace_period: 5s
    restart: unless-stopped

  grad-trainer-gpu:
    profiles: ["gpu"]
    image: ${GRAD_TRAINER_GPU_IMAGE:-docker.io/gradiated/grad-trainer:__GRAD_VERSION__-gpu}
    depends_on:
      grad-server:
        condition: service_healthy
    environment:
      GRAD_SERVER_URL: "http://grad-server:8787"
      TRAINER_API_KEY: "${GRAD_TRAINER_API_KEY:-}"
      GRAD_WORKER_ID: "local-gpu-trainer"
      GRAD_POLL_INTERVAL_S: "1.0"
      GRAD_WORKER_METRICS_PORT: "9465"
      # Sources on this machine (a local Langfuse): --host http://host.docker.internal:PORT,
      # with these CIDRs exported before `grad local up` (e.g. 172.16.0.0/12).
      GRAD_SOURCES_EGRESS_ALLOW: "${GRAD_SOURCES_EGRESS_ALLOW:-}"
    mem_limit: ${GRAD_TRAINER_MEMORY:-8g}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # On SIGTERM the worker releases its attempt (billed, requeued, resumed from the latest checkpoint).
    stop_grace_period: 2m
    # Downloaded base weights survive restarts.
    volumes:
      - grad-hf-cache:/home/grad/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # `grad local up --observability`: Prometheus and Grafana with the grad
  # dashboards, on loopback only and memory-capped.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    configs:
      - source: grad-prometheus
        target: /etc/prometheus/prometheus.yml
    mem_limit: ${GRAD_PROMETHEUS_MEMORY:-512m}
    ports:
      - "127.0.0.1:${GRAD_PROMETHEUS_PORT:-18789}:9090"
    volumes:
      - grad-prometheus:/prometheus
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    depends_on:
      - prometheus
    environment:
      # Loopback only: anyone on this machine may view; sign in as admin to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAD_GRAFANA_PASSWORD:-admin}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/grad/grad.json"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    configs:
      - source: grad-grafana-datasource
        target: /etc/grafana/provisioning/datasources/grad.yaml
      - source: grad-grafana-dashboards
        target: /etc/grafana/provisioning/dashboards/grad.yaml
    mem_limit: ${GRAD_GRAFANA_MEMORY:-768m}
    ports:
      - "127.0.0.1:${GRAD_GRAFANA_PORT:-18788}:3000"
    volumes:
      - ./grafana:/var/lib/grafana/dashboards/grad:ro
      - grad-grafana:/var/lib/grafana
    restart: unless-stopped

volumes:
  grad-pgdata:
  grad-s3:
  grad-hf-cache:
  grad-prometheus:
  grad-grafana:

configs:
  # SeaweedFS's S3 identities: one key, generated by `grad local up`.
  grad-s3:
    content: |
      {"identities": [{"name": "grad", "credentials": [{"accessKey": "${GRAD_S3_ACCESS_KEY:-}", "secretKey": "${GRAD_S3_SECRET_KEY:-}"}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
  grad-prometheus:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        # `pod` and `pool` match the labels Kubernetes scrapes add, so the
        # dashboard's legends and pool variable work here too.
        - job_name: grad-server
          static_configs:
            - targets: ["grad-server:8787"]
              labels: {pod: grad-server}
        # Worker metrics (GRAD_WORKER_METRICS_PORT); the GPU worker only with --gpu.
        - job_name: grad-trainer
          static_configs:
            - targets: ["grad-trainer:9465"]
              labels: {pod: grad-trainer, pool: cpu}
            - targets: ["grad-trainer-gpu:9465"]
              labels: {pod: grad-trainer-gpu, pool: gpu}
  grad-grafana-datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
  grad-grafana-dashboards:
    content: |
      apiVersion: 1
      providers:
        - name: grad
          folder: grad
          type: file
          options:
            path: /var/lib/grafana/dashboards/grad
