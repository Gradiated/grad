[package]
name = "grad-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CLI for the Gradiated training and serving platform"

[[bin]]
name = "grad"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
grad-sdk = { path = "../sdks/rust" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
