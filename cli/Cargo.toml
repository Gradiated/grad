[package]
name = "grad-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CLI for the Gradiated training and serving platform"
rust-version = "1.82"

[[bin]]
name = "grad"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.2"
grad-sdk = { path = "../sdks/rust" }
hex = "0.4"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "fs"] }

[dev-dependencies]
assert_cmd = "2"
flate2 = "1.0"
sha2 = "0.10"
