name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server-api:
    name: Server API & OpenAPI (Postgres + SeaweedFS S3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: grad
          POSTGRES_PASSWORD: grad_ci_only
          POSTGRES_DB: grad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grad -d grad"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      GRAD_TEST_DATABASE_URL: postgres://grad:grad_ci_only@127.0.0.1:5432/grad
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python

      # The S3 store is not a service container: the suite's globalSetup starts
      # one SeaweedFS (gradr8-s3-<pid>, a generated key and its S3 config file
      # mounted) like on a laptop, and removes it afterwards.
      - name: Install server/api dependencies
        run: pnpm -C server/api install --frozen-lockfile

      # The web UI: typecheck, component tests with a coverage gate, a build (so
      # the server's UI smoke test below runs against the real bundle) and the
      # Storybook build, which renders every component and page state.
      - name: Web UI (typecheck, tests with coverage, build, Storybook)
        run: |
          pnpm -C server/ui install --frozen-lockfile
          pnpm -C server/ui check
          pnpm -C server/ui exec vite build
          pnpm -C server/ui build-storybook

      - name: Check formatting
        run: pnpm -C server/api format:check

      - name: Typecheck
        run: pnpm -C server/api exec tsc --noEmit

      - name: Tests with coverage gate (Postgres store, SeaweedFS S3 storage)
        run: pnpm -C server/api test:coverage

      # Tokenless upload (OIDC); a failed upload never fails CI.
      - name: Upload server-api coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          flags: server-api
          files: server/api/coverage/lcov.info

      # Tokenless upload (OIDC); a failed upload never fails CI.
      - name: Upload web-ui coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          flags: web-ui
          files: server/ui/coverage/lcov.info

      - name: Build
        run: pnpm -C server/api build

      - name: Verify OpenAPI spec is up to date
        run: pnpm -C server/api openapi:check

      # The console's core journeys in a real browser (Chromium headless shell)
      # against tests/harness/stack.ts with the reference worker: sign in with a
      # scoped key, a dataset's records, a run followed live to its artifact,
      # promote and delete, an eval comparing it with its base, URL filters, a
      # read-only key's refusal, and axe (WCAG 2.1 AA) on every page it opens.
      - name: Web UI journeys (Playwright)
        run: |
          python3 -m pip install "jsonschema==4.26.0"
          pnpm -C server/ui exec playwright install --with-deps --only-shell chromium
          pnpm -C server/ui e2e

      - name: Upload the Playwright traces of failed journeys
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-ui-e2e-traces
          path: server/ui/e2e-results/
          if-no-files-found: ignore
          retention-days: 7

  server-trainer-torch:
    name: Trainer (CPU torch recipes, worker protocol and live worker tests, coverage gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python

      # The split parity check runs server/api code; the live worker tests start
      # tests/harness/stack.ts (its own Postgres container).
      - name: Install server/api dependencies
        run: pnpm -C server/api install --frozen-lockfile

      - name: Install pinned CPU torch stack
        run: |
          python3 -m venv /tmp/trainer-venv
          /tmp/trainer-venv/bin/pip install --no-cache-dir --require-hashes --no-deps -r server/trainer/requirements-cpu.lock
          /tmp/trainer-venv/bin/pip install --no-cache-dir -r server/trainer/requirements-dev.txt

      - name: Train every recipe on tiny models with coverage
        working-directory: server/trainer
        env:
          GRAD_TEST_THREADS: "4"
          HF_HUB_OFFLINE: "1"
        run: |
          PYTHONPATH=. /tmp/trainer-venv/bin/python -m coverage run -m unittest discover -s tests -v
          /tmp/trainer-venv/bin/python -m coverage report
          /tmp/trainer-venv/bin/python -m coverage xml -o coverage.xml

      # Tokenless upload (OIDC); a failed upload never fails CI.
      - name: Upload trainer coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          flags: trainer
          files: server/trainer/coverage.xml

  sdk-codegen:
    name: OpenAPI SDK Codegen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python go rust

      - name: Install server/api (YAML parser) and TypeScript SDK (tsc) dependencies
        run: |
          pnpm -C server/api install --frozen-lockfile
          pnpm -C sdks/typescript install --frozen-lockfile

      # The fixture-spec tests compile the generated TypeScript (tsc), Go (go vet/build)
      # and Rust (cargo check); fail instead of skipping when a toolchain is missing.
      - name: Run codegen unit tests and drift check
        env:
          GRAD_CODEGEN_REQUIRE_TOOLCHAINS: "1"
        run: |
          node --test scripts/generate-sdks.test.mjs
          node scripts/generate-sdks.mjs --check
          python3 -m py_compile sdks/python/grad/_generated/client.py

  sdks:
    name: SDKs (Python, TypeScript, Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python go

      # The live suites start tests/harness/stack.ts (its own Postgres container).
      - name: Install server/api dependencies for the live tests
        run: pnpm -C server/api install --frozen-lockfile

      # The live stacks run the reference worker on `python3`; it validates bundles
      # with jsonschema (pinned as in server/trainer/requirements.txt).
      - name: Install the reference worker's one dependency
        run: python3 -m pip install "jsonschema==4.26.0"

      - name: Test Python SDK (unit + live self-hosted/Cloud stack, coverage >= 90%, mypy --strict)
        run: |
          python3 -m venv /tmp/py-sdk-venv
          /tmp/py-sdk-venv/bin/pip install "httpx==0.29.0" "coverage==7.6.10" "mypy==2.4.1"
          PYTHONPATH=sdks/python /tmp/py-sdk-venv/bin/python -m coverage run --rcfile=sdks/python/pyproject.toml --data-file=/tmp/.coverage-py -m unittest discover -s sdks/python/tests -v
          /tmp/py-sdk-venv/bin/python -m coverage report --rcfile=sdks/python/pyproject.toml --data-file=/tmp/.coverage-py
          /tmp/py-sdk-venv/bin/python -m coverage xml --rcfile=sdks/python/pyproject.toml --data-file=/tmp/.coverage-py -o sdks/python/coverage.xml
          cd sdks/python && /tmp/py-sdk-venv/bin/mypy

      # Tokenless upload (OIDC); a failed upload never fails CI.
      - name: Upload sdk-python coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          flags: sdk-python
          files: sdks/python/coverage.xml

      - name: Type-check, unit test with coverage (>= 90% lines), and build the TypeScript SDK
        run: |
          pnpm -C sdks/typescript install --frozen-lockfile
          pnpm -C sdks/typescript check
          pnpm -C sdks/typescript build

      # Tokenless upload (OIDC); a failed upload never fails CI.
      - name: Upload sdk-typescript coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          flags: sdk-typescript
          files: sdks/typescript/coverage/lcov.info

      - name: TypeScript SDK live tests (self-hosted and cloud, reference worker)
        run: pnpm -C sdks/typescript test:live

      - name: Vet and test the Go SDK (unit + live), coverage >= 85%
        working-directory: sdks/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -count=1 -coverprofile=cover.out .
          go tool cover -func=cover.out | awk '/^total:/ { sub("%", "", $3); print "Go SDK coverage: " $3 "%"; if ($3 + 0 < 85) exit 1 }'

      # Tokenless upload (OIDC); a failed upload never fails CI.
      - name: Upload sdk-go coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          flags: sdk-go
          files: sdks/go/cover.out

  rust:
    name: Rust SDK & CLI (coverage gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python rust

      - name: Install server/api dependencies for the live CLI tests
        run: pnpm -C server/api install --frozen-lockfile

      - name: Install the reference worker's one dependency
        run: python3 -m pip install "jsonschema==4.26.0"

      - name: Lint Rust workspace (grad-sdk + grad CLI)
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check --package grad-cli
          cargo clippy --locked --workspace --all-targets -- -D warnings

      # Unit + mock-server tests, CLI integration tests (assert_cmd) and the live
      # quickstart against tests/harness/stack.ts (server/api deps are installed
      # above; the torch live test skips without GRAD_TRAINER_PYTHON).
      - name: Test Rust workspace with a coverage gate
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked --version 0.9.2
          cargo llvm-cov --locked --workspace \
            --ignore-filename-regex 'generated\.rs|/tests/' \
            --fail-under-lines 85 --lcov --output-path lcov.info
          cargo build --locked --bin grad

      # Tokenless upload (OIDC); a failed upload never fails CI.
      - name: Upload rust coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          flags: rust
          files: lcov.info

      - name: grad local up compose file is valid
        run: docker compose -f cli/assets/docker-compose.yml -f cli/assets/dev-models.yml --profile dev-models config --quiet

  stack-smoke:
    name: grad local up --build and Helm on kind (smoke tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python rust

      - name: Build the grad CLI
        run: cargo build --locked --bin grad

      - name: Python SDK dependencies
        run: |
          python3 -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install "httpx==0.29.0"

      # The web console's live tests (happy-dom against the stack).
      - name: Web UI dependencies
        run: pnpm -C server/ui install --frozen-lockfile

      # Builds the images from source, runs the CLI and Python SDK quickstart
      # (CPU torch trainer, tiny models), evals the trained artifact with a judge
      # on grad-dev-inference and checks the report in the CLI, the SDK and the
      # web console, restarts the stack to check persistence, then tears it down
      # with its volumes.
      - name: grad local up --build, quickstart, eval, restart, down --volumes
        env:
          GRAD_BIN: ${{ github.workspace }}/target/debug/grad
          GRAD_SMOKE_PYTHON: /tmp/smoke-venv/bin/python
          GRAD_SMOKE_UI: "1"
        run: tests/compose/smoke.sh

      - name: Install pinned kind, kubectl, helm and kubeconform
        run: scripts/install-k8s-tools "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Reuses the images the compose test built: install, a run across API pod
      # kills, NetworkPolicy egress, upgrade and uninstall.
      - name: Helm chart on kind
        timeout-minutes: 10
        env:
          GRAD_SERVER_IMAGE: grad-smoke-grad-server
          GRAD_TRAINER_IMAGE: grad-smoke-grad-trainer
        run: tests/helm/smoke.sh

  packaging:
    name: Docker Compose & Helm Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned kind, kubectl, helm and kubeconform
        run: scripts/install-k8s-tools "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate Docker Compose configuration
        run: |
          docker compose -f server/docker-compose.yml config --quiet
          docker compose -f server/docker-compose.yml -f tests/compose/smoke.yml config --quiet
          docker compose -f server/docker-compose.yml -f tests/compose/smoke.yml -f cli/assets/dev-models.yml --profile dev-models config --quiet
          python3 tests/compose/same-stack.py

      - name: Lint, template and kubeconform the Helm chart (default, kind, air-gapped/KEDA, monitoring, Cloud)
        run: |
          chart=server/helm/grad
          db=postgres://grad:ci@postgres:5432/grad
          helm lint "$chart" --strict --set storage.s3Bucket=lint --set secrets.databaseUrl="$db"
          helm lint "$chart" --strict -f "$chart/ci/kind-values.yaml"
          refuses() {  # refuses <why> <helm template args...>
            local why=$1; shift
            if out=$(helm template grad "$chart" "$@" 2>&1); then echo "the chart must refuse to render $why"; exit 1; fi
            echo "ok: refuses $why: ${out##*error calling fail: }"
          }
          refuses "without storage.s3Bucket" --set secrets.databaseUrl="$db"
          refuses "without secrets.databaseUrl" --set storage.s3Bucket=artifacts
          refuses "without secrets.existingSecret" --set storage.s3Bucket=artifacts --set secrets.create=false
          refuses "the old docs' database.existingSecret" --set storage.s3Bucket=artifacts --set secrets.databaseUrl="$db" --set database.existingSecret=grad-postgres
          refuses "the old docs' trainer.gpuCount" --set storage.s3Bucket=artifacts --set secrets.databaseUrl="$db" --set trainer.gpuCount=1
          refuses "the old docs' keda.maxReplicaCount" --set storage.s3Bucket=artifacts --set secrets.databaseUrl="$db" --set keda.maxReplicaCount=4
          refuses "the old docs' models.mirrorUri" --set storage.s3Bucket=artifacts --set secrets.databaseUrl="$db" --set models.mirrorUri=s3://m
          refuses "a worker pod with 2 GPUs (a worker trains on one)" --set storage.s3Bucket=artifacts --set secrets.databaseUrl="$db" --set workers.train.gpuCount=2
          refuses "an unknown workers.auth" --set storage.s3Bucket=artifacts --set secrets.databaseUrl="$db" --set workers.auth=oauth
          refuses "lease without api.internalPort" --set storage.s3Bucket=artifacts --set secrets.databaseUrl="$db" --set 'workers.auth={kubernetes,lease}'
          refuses "lease without orchestrator keys" --set storage.s3Bucket=artifacts --set secrets.databaseUrl="$db" --set 'workers.auth={kubernetes,lease}' --set api.internalPort=8788
          refuses "in-cluster pools with lease only" --set storage.s3Bucket=artifacts --set secrets.databaseUrl="$db" --set workers.auth=lease --set api.internalPort=8788 --set secrets.orchestratorKeysJson=x
          refuses "a key under database other than caBundle" --set storage.s3Bucket=artifacts --set secrets.databaseUrl="$db" --set database.awsAccessKeyId=x
          refuses "both database.caBundle sources" --set storage.s3Bucket=artifacts --set secrets.databaseUrl="$db" --set database.caBundle.configMap.name=rds-ca --set database.caBundle.pem=x
          # As a dependency of an umbrella chart, which always passes `global`.
          umbrella="$RUNNER_TEMP/umbrella" && mkdir -p "$umbrella/charts" && cp -rL "$chart" "$umbrella/charts/grad"
          printf 'apiVersion: v2\nname: umbrella\nversion: 0.1.0\ndependencies: [{name: grad, version: "%s"}]\n' "$(sed -n 's/^version: //p' "$chart/Chart.yaml")" > "$umbrella/Chart.yaml"
          helm template u "$umbrella" --set global.imageRegistry=r.example --set grad.storage.s3Bucket=b --set grad.secrets.databaseUrl="$db" > /dev/null
          autoscaling() {  # autoscaling <want> <helm template args...>: a waiting run says a worker is starting only if one can
            local want=$1; shift
            got=$(helm template grad "$chart" --set storage.s3Bucket=a --set secrets.databaseUrl="$db" --set keda.enabled=true --set keda.trigger=metrics-api "$@" | grep -F GRAD_WORKER_AUTOSCALING)
            [[ $got == *"value: \"$want\""* ]] || { echo "GRAD_WORKER_AUTOSCALING should be $want with $*: $got"; exit 1; }
          }
          autoscaling true
          autoscaling false --set workers.train.enabled=false
          autoscaling true --set workers.train.enabled=false --set api.workerAutoscaling=true
          {
            helm template grad "$chart" --set storage.s3Bucket=artifacts --set secrets.databaseUrl="$db"
            echo ---
            helm template grad "$chart" --set storage.s3Bucket=artifacts --set secrets.create=false --set secrets.existingSecret=grad
            echo ---
            helm template grad "$chart" -f "$chart/ci/kind-values.yaml"
            echo ---
            helm template grad "$chart" -f "$chart/ci/kind-values.yaml" --set workers.auth=static --set trainingPriorityClass.enabled=false
            echo ---
            # In-cluster pools on service-account tokens, leased GPU hosts beside them; API HPA.
            printf '[{"label":"gpu-fleet","sha256":"%064d","kinds":["train"]}]' 0 > "$RUNNER_TEMP/orchestrator-keys.json"
            helm template grad "$chart" --set storage.s3Bucket=artifacts --set secrets.databaseUrl="$db" \
              --set 'workers.auth={kubernetes,lease}' --set api.internalPort=8788 \
              --set-file secrets.orchestratorKeysJson="$RUNNER_TEMP/orchestrator-keys.json" \
              --set networkPolicy.enabled=true --set 'networkPolicy.internalIngressFrom[0].ipBlock.cidr=10.20.0.0/16' \
              --set api.autoscaling.enabled=true
            echo ---
            # An inline Postgres CA bundle (kind-values.yaml names a ConfigMap).
            helm template grad "$chart" --set storage.s3Bucket=artifacts --set secrets.databaseUrl="$db" --set-file database.caBundle.pem=/etc/ssl/certs/ca-certificates.crt
            echo ---
            helm template grad "$chart" \
              --set storage.s3Bucket=airgap-artifacts \
              --set secrets.databaseUrl="$db" \
              --set keda.enabled=true \
              --set keda.trigger=metrics-api \
              --set ingress.enabled=true \
              --set networkPolicy.enabled=true \
              --set migrations.enabled=false \
              --set models.mirror=s3://airgap/models \
              --set evals.inferenceBaseUrl=https://vllm.internal/v1 \
              --set evals.judgeBaseUrl=https://judge.internal/v1
            echo ---
            helm template grad "$chart" \
              --set storage.s3Bucket=monitored-artifacts \
              --set secrets.databaseUrl="$db" \
              --set keda.enabled=true \
              --set keda.prometheus.serverAddress=http://prometheus-operated.monitoring.svc:9090 \
              --set metrics.requireToken=true \
              --set metrics.serviceMonitor.enabled=true \
              --set metrics.podMonitor.enabled=true \
              --set metrics.prometheusRule.enabled=true \
              --set metrics.grafanaDashboards.enabled=true \
              --set networkPolicy.enabled=true
            echo ---
            helm template grad "$chart" \
              --set storage.s3Bucket=cloud-artifacts \
              --set secrets.databaseUrl="$db" \
              --set api.authMode=cloud \
              --set api.billingMode=cloud \
              --set cloud.internalApiUrl=https://api.gradiated.com \
              --set workers.train.enabled=false
          } > "$RUNNER_TEMP/rendered.yaml"
          # KEDA's and prometheus-operator's CRDs have no schema in the default catalog.
          for want in 'GRAD_WORKER_AUTH, value: "static"' 'GRAD_WORKER_AUTH, value: "kubernetes"' 'GRAD_WORKER_AUTH, value: "kubernetes,lease"' 'key: orchestrator-keys-json' 'kind: HorizontalPodAutoscaler' 'rollingUpdate: {maxSurge: 0, maxUnavailable: 1}' 'kind: PriorityClass' 'resources: [tokenreviews]' 'name: PGSSLROOTCERT' 'name: grad-grad-postgres-ca'; do
            grep -qF "$want" "$RUNNER_TEMP/rendered.yaml" || { echo "rendered charts lack: $want"; exit 1; }
          done
          kubeconform -strict -summary -kubernetes-version 1.37.0 \
            -skip ScaledObject,TriggerAuthentication,ServiceMonitor,PodMonitor,PrometheusRule "$RUNNER_TEMP/rendered.yaml"

      - name: Alert rules against Prometheus (promtool check and unit tests)
        run: tests/helm/alerts.sh

  versions:
    name: One version across the repo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every package has the same version
        run: scripts/bump-version --check

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks via mise
