name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server-api:
    name: Server API & OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm

      - name: Install server/api dependencies
        run: pnpm -C server/api install --frozen-lockfile

      - name: Check formatting
        run: pnpm -C server/api format:check

      - name: Typecheck & unit tests
        run: pnpm -C server/api check

      - name: Build
        run: pnpm -C server/api build

      - name: Verify OpenAPI spec is up to date
        run: pnpm -C server/api openapi:check

  server-trainer:
    name: Server Trainer & Connectors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python

      - name: Install server/api dependencies for live worker E2E
        run: pnpm -C server/api install --frozen-lockfile

      - name: Run trainer unit and live worker E2E tests
        run: PYTHONPATH=server/trainer python3 -m unittest discover -s server/trainer/tests -v

  sdk-codegen:
    name: OpenAPI SDK Codegen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python

      - name: Install server/api dependencies for YAML parser
        run: pnpm -C server/api install --frozen-lockfile

      - name: Run codegen unit tests and drift check
        run: |
          node --test scripts/generate-sdks.test.mjs
          node scripts/generate-sdks.mjs --check
          python3 -m py_compile sdks/python/grad/_generated/client.py

  sdks:
    name: SDKs (Python, TypeScript, Go, Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python go rust

      - name: Test Python SDK
        run: PYTHONPATH=sdks/python python3 -m unittest discover -s sdks/python/tests -v

      - name: Install, check, and build TypeScript SDK
        run: |
          pnpm -C sdks/typescript install --frozen-lockfile
          pnpm -C sdks/typescript check
          pnpm -C sdks/typescript build

      - name: Test Go SDK
        run: cd sdks/go && go test ./...

      - name: Test Rust SDK
        run: cargo test --package grad-sdk

  cli-and-e2e:
    name: Rust CLI & Cross-Language E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python go rust

      - name: Build server/api and TypeScript SDK
        run: |
          pnpm -C server/api install --frozen-lockfile
          pnpm -C sdks/typescript install --frozen-lockfile
          pnpm -C sdks/typescript build

      - name: Test and build Rust workspace (grad-sdk + grad CLI)
        run: |
          cargo test --workspace
          cargo build --bin grad

      - name: Run full cross-language E2E contract suite (Python + TS + Go + Rust CLI)
        run: python3 tests/contract/run_e2e.py

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: gitleaks

      - name: Scan for secrets
        run: gitleaks git --no-banner --redact --verbose
