name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server-api:
    name: Server API & OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm

      - name: Install server/api dependencies
        run: pnpm -C server/api install --frozen-lockfile

      - name: Check formatting
        run: pnpm -C server/api format:check

      - name: Typecheck & unit tests
        run: pnpm -C server/api check

      - name: Build
        run: pnpm -C server/api build

      - name: Verify OpenAPI spec is up to date
        run: pnpm -C server/api openapi:check

  server-integration:
    name: Server API on Postgres + S3 (self-hosted mode)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: grad
          POSTGRES_PASSWORD: grad_ci_only
          POSTGRES_DB: grad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grad -d grad"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      GRAD_TEST_DATABASE_URL: postgres://grad:grad_ci_only@127.0.0.1:5432/grad
      GRAD_REQUIRE_POSTGRES: "1"
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_BUCKET: grad-ci
      AWS_ACCESS_KEY_ID: gradci
      AWS_SECRET_ACCESS_KEY: grad-ci-only-secret
      GRAD_REQUIRE_S3: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python

      # MinIO needs `server /data` as its command, which service containers cannot pass.
      # pgsty/minio is the maintained community build (the official image is no longer published).
      - name: Start MinIO
        run: |
          docker run -d --name grad-ci-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data

      - name: Install server/api dependencies
        run: pnpm -C server/api install --frozen-lockfile

      - name: Tests with coverage gate (memory + Postgres stores, local + S3 storage)
        run: pnpm -C server/api test:coverage

      - name: Live worker protocol test against the built server
        run: PYTHONPATH=server/trainer python3 -m unittest discover -s server/trainer/tests -p 'test_worker_*.py' -v

  server-trainer:
    name: Server Trainer & Connectors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python

      - name: Install server/api dependencies for live worker E2E
        run: pnpm -C server/api install --frozen-lockfile

      - name: Run trainer unit and live worker E2E tests
        run: PYTHONPATH=server/trainer python3 -m unittest discover -s server/trainer/tests -v

  sdk-codegen:
    name: OpenAPI SDK Codegen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python

      - name: Install server/api dependencies for YAML parser
        run: pnpm -C server/api install --frozen-lockfile

      - name: Run codegen unit tests and drift check
        run: |
          node --test scripts/generate-sdks.test.mjs
          node scripts/generate-sdks.mjs --check
          python3 -m py_compile sdks/python/grad/_generated/client.py

  sdks:
    name: SDKs (Python, TypeScript, Go, Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python go rust

      - name: Test Python SDK
        run: PYTHONPATH=sdks/python python3 -m unittest discover -s sdks/python/tests -v

      - name: Install, check, and build TypeScript SDK
        run: |
          pnpm -C sdks/typescript install --frozen-lockfile
          pnpm -C sdks/typescript check
          pnpm -C sdks/typescript build

      - name: Test Go SDK
        run: cd sdks/go && go test ./...

      - name: Test Rust SDK
        run: cargo test --package grad-sdk

  cli-and-e2e:
    name: Rust CLI & Cross-Language E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node pnpm python go rust

      - name: Build server/api and TypeScript SDK
        run: |
          pnpm -C server/api install --frozen-lockfile
          pnpm -C sdks/typescript install --frozen-lockfile
          pnpm -C sdks/typescript build

      - name: Test and build Rust workspace (grad-sdk + grad CLI)
        run: |
          cargo test --workspace
          cargo build --bin grad

      - name: Run full cross-language E2E contract suite (Python + TS + Go + Rust CLI)
        run: python3 tests/contract/run_e2e.py

  packaging:
    name: Docker Compose & Helm Packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install helm via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: helm

      - name: Validate Docker Compose configuration
        run: docker compose -f server/docker-compose.yml config --quiet

      - name: Lint and template Helm chart (default and air-gapped/KEDA profiles)
        run: |
          helm lint server/helm/grad --strict
          helm template grad server/helm/grad > /dev/null
          helm template grad server/helm/grad \
            --set keda.enabled=true \
            --set ingress.enabled=true \
            --set storage.s3Bucket=airgap-artifacts \
            --set models.mirrorUri=s3://airgap/models \
            --set judge.baseUrl=https://vllm.internal/v1 > /dev/null
          helm template grad server/helm/grad \
            --set api.authMode=cloud \
            --set api.billingMode=cloud \
            --set api.deployMode=cloud \
            --set cloud.internalApiUrl=https://api.gradiated.com \
            --set cloud.existingSecret=grad-cloud > /dev/null

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: gitleaks

      - name: Scan for secrets
        run: gitleaks git --no-banner --redact --verbose
