name: Images

# Builds the container images once and pushes them to Docker Hub (primary) and GHCR (mirror):
#   docker.io/gradiated/grad-server         linux/amd64 + linux/arm64
#   docker.io/gradiated/grad-trainer        CPU, linux/amd64 + linux/arm64
#   docker.io/gradiated/grad-trainer:*-gpu  CUDA, linux/amd64
# and the same tags under ghcr.io/gradiated/. Docker Hub uses the repository secrets
# DOCKERHUB_USERNAME (the org name, for an organization access token) and DOCKERHUB_TOKEN;
# release.yml passes them with `secrets: inherit`. A push to main also syncs each Docker Hub
# repository overview from deploy/dockerhub/<image>.md.
# A push to main tags `main` and `sha-<7>` (GPU: `main-gpu`, `sha-<7>-gpu`). The GPU image is
# large, so main rebuilds it only when server/trainer/ or this workflow changed, or on a manual
# run with `gpu`. release.yml calls this with `version`, which tags `X.Y.Z` (and `latest` unless
# it's a prerelease) and always includes the GPU image.

on:
  push:
    branches:
      - main
    paths:
      - server/api/**
      - server/ui/**
      - sdks/typescript/src/**
      - server/trainer/**
      - deploy/dockerhub/**
      - .github/workflows/images.yml
  workflow_dispatch:
    inputs:
      gpu:
        description: Also build the GPU trainer image
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z) to tag the images with
        type: string
        required: true
      environment:
        description: Deployment environment for the publish jobs (release, for a tag)
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions: {}

jobs:
  plan:
    name: Pick the images to build
    # Only main and releases publish; a manual run on another branch would move `main`.
    if: inputs.version != '' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: CPU images always; the GPU image for releases, manual runs or trainer changes
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          GPU_INPUT: ${{ inputs.gpu }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          gpu=false
          if [ -n "$VERSION" ] || [ "$GPU_INPUT" = "true" ]; then
            gpu=true
          elif [ "$EVENT" = "push" ]; then
            if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              gpu=true # first push or unknown base: build it to be safe
            elif git diff --name-only "$BEFORE" "$GITHUB_SHA" -- server/trainer .github/workflows/images.yml | grep -q .; then
              gpu=true
            fi
          fi
          matrix='[
            {"image":"grad-server","context":".","file":"server/api/Dockerfile","target":"","platforms":"linux/amd64,linux/arm64","suffix":""},
            {"image":"grad-trainer","context":"server/trainer","file":"server/trainer/Dockerfile","target":"cpu","platforms":"linux/amd64,linux/arm64","suffix":""}
          ]'
          if [ "$gpu" = "true" ]; then
            matrix=$(jq -c '. + [{"image":"grad-trainer","context":"server/trainer","file":"server/trainer/Dockerfile","target":"gpu","platforms":"linux/amd64","suffix":"-gpu"}]' <<<"$matrix")
          fi
          echo "matrix=$(jq -c . <<<"$matrix")" >> "$GITHUB_OUTPUT"
          echo "GPU image: $gpu"

  build:
    name: ${{ matrix.image }}${{ matrix.suffix }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.target == 'gpu' && 90 || 60 }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    # One build per image at a time. On main only the newest commit matters: a newer push
    # replaces the build still waiting, never the one running (main gets pushes every few
    # minutes, so cancelling would starve the slow arm64 builds).
    concurrency:
      group: images-${{ github.ref }}-${{ matrix.image }}${{ matrix.suffix }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      RELEASE: ${{ inputs.version != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The CUDA torch image does not fit on a stock runner disk.
      - name: Free disk space
        if: matrix.target == 'gpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Releases: 0.3.0 and latest (0.3.0-gpu, latest-gpu); prereleases never move latest.
      # main: main and sha-abc1234 (main-gpu, sha-abc1234-gpu). One build, both registries.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            docker.io/gradiated/${{ matrix.image }}
            ghcr.io/gradiated/${{ matrix.image }}
          flavor: |
            latest=${{ env.RELEASE == 'true' && 'auto' || 'false' }}
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ env.RELEASE == 'true' }}
            type=raw,value=main,enable=${{ env.RELEASE != 'true' }}
            type=sha,prefix=sha-,format=short,enable=${{ env.RELEASE != 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # grad-server builds from the repository root (its image includes server/ui).
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          # The GPU image's layers would crowd the CPU images out of the 10 GB cache.
          cache-from: type=gha,scope=${{ matrix.image }}${{ matrix.suffix }}
          cache-to: type=gha,scope=${{ matrix.image }}${{ matrix.suffix }},mode=${{ matrix.target == 'gpu' && 'min' || 'max' }}

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${{ matrix.image }}${{ matrix.suffix }}"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            while read -r tag; do [ -n "$tag" ] && echo "- \`$tag\`"; done <<<"$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  # Docker Hub repository overviews, from deploy/dockerhub/. Best effort: an organization access
  # token without permission to edit repositories fails this step without failing the run.
  overview:
    name: Docker Hub overview (${{ matrix.image }})
    needs: build
    if: ${{ !cancelled() && inputs.version == '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: grad-server
            short: "grad API server and web UI: fine-tune open models from traces, evals and recipes."
          - image: grad-trainer
            short: "grad training worker (CPU; CUDA as *-gpu): runs SFT, DPO, reward and eval jobs."
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update the repository overview
        id: sync
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: gradiated/${{ matrix.image }}
          short-description: ${{ matrix.short }}
          readme-filepath: deploy/dockerhub/${{ matrix.image }}.md

      - name: Report a skipped sync
        if: steps.sync.outcome == 'failure'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          msg="Could not update the Docker Hub overview of gradiated/$IMAGE (the token may lack permission to edit repositories); the images are published regardless."
          echo "::warning::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
