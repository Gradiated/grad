name: Feature request
description: Suggest a new recipe, API, SDK method or CLI command.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you want done and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like grad to do?
      description: The API, command or behavior you have in mind. A code sketch helps.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
