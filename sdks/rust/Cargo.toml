[package]
name = "grad-sdk"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Rust SDK for the Gradiated training and serving platform"
rust-version = "1.82"
repository = "https://github.com/Gradiated/grad"
homepage = "https://gradiated.com/docs/training/"
documentation = "https://docs.rs/grad-sdk"
keywords = ["llm", "fine-tuning", "lora", "sdk", "gradiated"]
categories = ["api-bindings"]

[dependencies]
flate2 = "1.0"
getrandom = "0.2"
hex = "0.4"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["time", "fs", "rt"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "fs"] }
