[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grad-sdk"
dynamic = ["version"]
description = "Python SDK for the Gradiated training platform: datasets, managed fine-tuning runs, evals and artifacts."
readme = "README.md"
license = "MIT"
authors = [{ name = "Gradiated" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]
keywords = ["llm", "fine-tuning", "lora", "peft", "evals", "routing", "gradiated"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://gradiated.com"
Documentation = "https://gradiated.com/docs/training"
Repository = "https://github.com/Gradiated/grad"
Changelog = "https://github.com/Gradiated/grad/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["coverage>=7.6", "mypy>=1.13"]

[tool.setuptools.dynamic]
version = { attr = "grad._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["grad*"]

[tool.setuptools.package-data]
grad = ["py.typed"]

[tool.coverage.run]
branch = true
source = ["grad"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
strict = true
python_version = "3.11"
files = ["grad"]
