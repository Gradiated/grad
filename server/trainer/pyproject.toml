[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grad-trainer"
version = "0.2.0"
description = "Gradiated training runtime: torch/transformers/peft recipes, artifact bundles and trace connectors"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Exact pins; requirements-{gpu,cpu}.lock pin the full transitive set.
dependencies = [
  "torch==2.15.0",
  "transformers==5.23.0",
  "peft==0.21.3",
  "tokenizers==0.23.3",
  "safetensors==0.8.0",
  "huggingface_hub==2.4.0",
  "accelerate==1.15.0",
  "datasets==5.1.0",
  "numpy==2.5.4",
  "jinja2==3.1.6",
  "boto3==1.44.12",
]

[project.optional-dependencies]
dev = ["coverage==7.17.4"]

[project.scripts]
grad-trainer = "grad_trainer.worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["grad_trainer*"]

[tool.coverage.run]
branch = true
source = ["grad_trainer"]

[tool.coverage.report]
show_missing = true
fail_under = 90
