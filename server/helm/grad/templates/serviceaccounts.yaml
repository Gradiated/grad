{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "grad.apiServiceAccount" . }}
  labels:
    {{- include "grad.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if eq (include "grad.workerAuth" .) "kubernetes" }}
{{- /* One ServiceAccount per pool: grad-server maps it to the pool's kinds (TokenReview). */}}
{{- range $name, $w := omit .Values.workers "auth" }}
{{- if $w.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "grad.poolServiceAccount" (list $ $name) }}
  labels:
    {{- include "grad.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    grad.gradiated.com/worker: {{ $name }}
  {{- with $.Values.workerServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- else if .Values.workerServiceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "grad.workerServiceAccount" . }}
  labels:
    {{- include "grad.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  {{- with .Values.workerServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
