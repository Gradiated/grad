{{- include "grad.validate" . -}}
{{- $ca := include "grad.postgresCa" . -}}
{{- /* Runs scale from zero only when KEDA scales a pool that takes train jobs. */ -}}
{{- $autoscaling := false -}}
{{- range $name, $w := omit .Values.workers "auth" -}}
{{- if and $.Values.keda.enabled $w.enabled (has "train" ($w.kinds | default list)) -}}
{{- $autoscaling = true -}}
{{- end -}}
{{- end -}}
{{- if kindIs "bool" .Values.api.workerAutoscaling -}}
{{- $autoscaling = .Values.api.workerAutoscaling -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grad.fullname" . }}-api
  labels:
    {{- include "grad.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  # A new replica is ready before an old one stops: no capacity dip on upgrade.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "grad.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "grad.apiServiceAccount" . }}
      # workers.auth=kubernetes: the in-cluster credentials for TokenReview (rbac.yaml).
      automountServiceAccountToken: {{ eq (include "grad.workerAuth" .) "kubernetes" }}
      securityContext:
        {{- include "grad.podSecurity" (list 1000) | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Prefer replicas on different nodes and zones, so one node or zone loss
      # leaves one serving (soft: a one-node cluster still schedules them).
      topologySpreadConstraints:
        {{- range $key := list "kubernetes.io/hostname" "topology.kubernetes.io/zone" }}
        - maxSkew: 1
          topologyKey: {{ $key }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: api
        {{- end }}
      # The drain + background stop + 5 s for open requests, with margin.
      terminationGracePeriodSeconds: {{ add (int .Values.api.shutdownDrainSeconds) 25 }}
      containers:
        - name: grad-server
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
            {{- if gt (int .Values.api.internalPort) 0 }}
            - name: internal
              containerPort: {{ .Values.api.internalPort }}
            {{- end }}
          env:
            - {name: HOST, value: "0.0.0.0"}
            - {name: PORT, value: {{ .Values.api.service.port | quote }}}
            {{- if gt (int .Values.api.internalPort) 0 }}
            - {name: INTERNAL_PORT, value: {{ .Values.api.internalPort | quote }}}
            {{- end }}
            # SIGTERM: readiness fails and the server keeps serving while the
            # endpoint is removed, then closes (server/api/src/shutdown.ts).
            - {name: SHUTDOWN_DRAIN_SECONDS, value: {{ .Values.api.shutdownDrainSeconds | quote }}}
            - {name: AUTH_MODE, value: {{ .Values.api.authMode | quote }}}
            - {name: BILLING_MODE, value: {{ .Values.api.billingMode | quote }}}
            - {name: DEFAULT_WORKSPACE_ID, value: {{ .Values.api.defaultWorkspaceId | quote }}}
            {{- with .Values.api.queue }}
            - {name: GRAD_MAX_RUNNING_PER_WORKSPACE_TRAIN, value: {{ .maxRunningPerWorkspace.train | quote }}}
            - {name: GRAD_MAX_RUNNING_PER_WORKSPACE_IMPORT, value: {{ .maxRunningPerWorkspace.import | quote }}}
            - {name: GRAD_MAX_RUNNING_PER_WORKSPACE_EVAL, value: {{ .maxRunningPerWorkspace.eval | quote }}}
            - {name: GRAD_MAX_QUEUED_PER_WORKSPACE, value: {{ .maxQueuedPerWorkspace | quote }}}
            {{- end }}
            - {name: UI_ENABLED, value: {{ .Values.ui.enabled | quote }}}
            - {name: MIGRATE_ON_BOOT, value: {{ ternary "false" "true" .Values.migrations.enabled | quote }}}
            - {name: S3_BUCKET, value: {{ .Values.storage.s3Bucket | quote }}}
            - {name: S3_REGION, value: {{ .Values.storage.s3Region | quote }}}
            {{- with .Values.storage.s3Endpoint }}
            - {name: S3_ENDPOINT, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.storage.s3PublicEndpoint }}
            - {name: S3_PUBLIC_ENDPOINT, value: {{ . | quote }}}
            {{- end }}
            # Evals run on the eval workers; the API only checks an endpoint is set.
            {{- with .Values.evals.inferenceBaseUrl }}
            - {name: GRAD_INFERENCE_BASE_URL, value: {{ . | quote }}}
            {{- end }}
            - {name: GRAD_WORKER_AUTOSCALING, value: {{ $autoscaling | quote }}}
            - {name: METRICS_ENABLED, value: {{ .Values.metrics.enabled | quote }}}
            {{- if .Values.metrics.enabled }}
            - {name: METRICS_PORT, value: {{ .Values.metrics.port | quote }}}
            - {name: METRICS_WORKSPACE_LABEL, value: {{ .Values.metrics.workspaceLabel | quote }}}
            {{- if .Values.metrics.requireToken }}
            {{- include "grad.secretEnv" (list . "METRICS_TOKEN" "metrics-token" false) | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- with .Values.cloud.internalApiUrl }}
            - {name: CLOUD_INTERNAL_API_URL, value: {{ . | quote }}}
            {{- end }}
            {{- range $name, $value := dict "GRAD_CLOUD_JWKS_URL" .Values.cloud.jwksUrl "GRAD_CLOUD_JWT_ISSUER" .Values.cloud.jwtIssuer "GRAD_CLOUD_BILLING_URL" .Values.cloud.billingUrl "GRAD_CLOUD_PRICES_URL" .Values.cloud.pricesUrl "GRAD_CLOUD_GATEWAY_URL" .Values.cloud.gatewayUrl "GRAD_CORS_ORIGINS" .Values.cloud.corsOrigins "GRAD_SECRETS_KMS_KEY_ID" .Values.cloud.secretsKmsKeyId }}
            {{- with $value }}
            - {name: {{ $name }}, value: {{ . | quote }}}
            {{- end }}
            {{- end }}
            {{- include "grad.secretEnv" (list . "GRAD_CLOUD_AUTH_DATABASE_URL" "cloud-auth-database-url" true) | nindent 12 }}
            {{- include "grad.secretEnv" (list . "DATABASE_URL" "database-url" false) | nindent 12 }}
            {{- if $ca }}
            # verify-full against database.caBundle (server/api/src/store/postgres/tls.ts).
            - {name: PGSSLROOTCERT, value: /etc/grad/postgres-ca/ca.pem}
            {{- end }}
            {{- include "grad.secretEnv" (list . "ADMIN_API_KEY_HASH" "admin-api-key-hash" true) | nindent 12 }}
            {{- $modes := splitList "," (include "grad.workerAuthModes" .) }}
            - {name: GRAD_WORKER_AUTH, value: {{ include "grad.workerAuthModes" . | quote }}}
            {{- if has "kubernetes" $modes }}
            - {name: GRAD_WORKER_K8S_SERVICE_ACCOUNTS, value: {{ include "grad.workerServiceAccountsJson" . | quote }}}
            {{- end }}
            {{- if has "static" $modes }}
            {{- include "grad.secretEnv" (list . "TRAINER_API_KEY" "trainer-api-key" true) | nindent 12 }}
            {{- include "grad.secretEnv" (list . "TRAINER_KEYS_JSON" "trainer-keys-json" true) | nindent 12 }}
            {{- end }}
            {{- if has "lease" $modes }}
            {{- include "grad.secretEnv" (list . "GRAD_ORCHESTRATOR_KEYS_JSON" "orchestrator-keys-json" false) | nindent 12 }}
            {{- end }}
            {{- include "grad.secretEnv" (list . "GRAD_SECRETS_KEY" "secrets-key" true) | nindent 12 }}
            {{- include "grad.secretEnv" (list . "CLOUD_SERVICE_TOKEN" "cloud-service-token" true) | nindent 12 }}
            {{- include "grad.secretEnv" (list . "AWS_ACCESS_KEY_ID" "aws-access-key-id" true) | nindent 12 }}
            {{- include "grad.secretEnv" (list . "AWS_SECRET_ACCESS_KEY" "aws-secret-access-key" true) | nindent 12 }}
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            {{- include "grad.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $ca }}
            - {name: postgres-ca, mountPath: /etc/grad/postgres-ca, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $ca }}
        - name: postgres-ca
          configMap:
            name: {{ $ca }}
            items: [{key: {{ include "grad.postgresCaKey" . }}, path: ca.pem}]
        {{- end }}
