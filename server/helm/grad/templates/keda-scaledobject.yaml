{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "grad.fullname" . }}-postgres-trigger-auth
  labels:
    {{- include "grad.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: connection
      name: {{ .Values.database.existingSecret }}
      key: {{ .Values.database.secretKey }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "grad.fullname" . }}-trainer-scaler
  labels:
    {{- include "grad.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "grad.fullname" . }}-trainer
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  triggers:
    - type: postgresql
      metadata:
        # Queued plus running (open-lease) jobs, so a scale-down never strands a running job.
        query: "SELECT (SELECT COUNT(*) FROM grad_runs WHERE (status = 'queued' AND waiting_on IS NULL) OR worker_id IS NOT NULL) + (SELECT COUNT(*) FROM grad_import_jobs WHERE status = 'queued' OR worker_id IS NOT NULL)"
        targetQueryValue: {{ .Values.keda.targetQueuedRuns | quote }}
      authenticationRef:
        name: {{ include "grad.fullname" . }}-postgres-trigger-auth
{{- end }}
