{{- if .Values.keda.enabled }}
{{- $metricsApi := eq .Values.keda.trigger "metrics-api" }}
{{- if and $metricsApi .Values.metrics.requireToken }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "grad.fullname" . }}-metrics
  labels:
    {{- include "grad.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: token
      name: {{ include "grad.secretName" . }}
      key: metrics-token
{{- end }}
{{- range $name, $w := omit .Values.workers "auth" }}
{{- if $w.enabled }}
{{- $scale := index $.Values.keda.workers $name | default dict }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "grad.fullname" $ }}-worker-{{ $name }}
  labels:
    {{- include "grad.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "grad.fullname" $ }}-worker-{{ $name }}
  pollingInterval: {{ $.Values.keda.pollingInterval }}
  cooldownPeriod: {{ $.Values.keda.cooldownPeriod }}
  minReplicaCount: {{ $scale.minReplicaCount | default 0 }}
  maxReplicaCount: {{ $scale.maxReplicaCount | default 4 }}
  # Open jobs of this pool's kinds: queued (claimable) plus running (leased),
  # so a scale-down never strands a running job.
  triggers:
    {{- if $metricsApi }}
    - type: metrics-api
      metadata:
        url: {{ include "grad.queueDepthUrl" (list $ $w.kinds) | quote }}
        format: json
        valueLocation: open
        targetValue: {{ $.Values.keda.targetOpenJobs | quote }}
        {{- if $.Values.metrics.requireToken }}
        authMode: bearer
      authenticationRef:
        name: {{ include "grad.fullname" $ }}-metrics
        {{- end }}
    {{- else }}
    - type: prometheus
      metadata:
        serverAddress: {{ $.Values.keda.prometheus.serverAddress | quote }}
        query: {{ include "grad.openJobsPromQL" (list $ $w.kinds) | quote }}
        threshold: {{ $.Values.keda.targetOpenJobs | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
