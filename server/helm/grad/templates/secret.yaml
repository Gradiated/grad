{{- if .Values.secrets.create }}
{{- $name := include "grad.secretName" . }}
{{- $s := .Values.secrets }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- /* A value from values.yaml, else the key already in the Secret (kept across upgrades), else "". */}}
{{- $keep := dict }}
{{- range $key, $value := $old }}{{ $_ := set $keep $key (b64dec $value) }}{{ end }}
{{- $data := dict "database-url" ($s.databaseUrl | default (get $keep "database-url")) }}
{{- if not (get $data "database-url") }}
{{- fail "secrets.databaseUrl is required: the Postgres URL, e.g. --set secrets.databaseUrl=postgres://grad:...@postgres:5432/grad (or set secrets.create=false and secrets.existingSecret)." }}
{{- end }}
{{- /* Generated keys: made once, then read back with lookup on every upgrade. */}}
{{- $_ := set $data "secrets-key" ($s.secretsKey | default (get $keep "secrets-key") | default (randBytes 32)) }}
{{- if $s.adminApiKeyHash }}
{{- $_ := set $data "admin-api-key-hash" $s.adminApiKeyHash }}
{{- else }}
{{- $admin := get $keep "admin-api-key" | default (printf "grad_%s" (randAlphaNum 40)) }}
{{- $_ := set $data "admin-api-key" $admin }}
{{- $_ := set $data "admin-api-key-hash" (sha256sum $admin) }}
{{- end }}
{{- /* workers.auth=static: one key per worker pool, scoped to the pool's job kinds (TRAINER_KEYS_JSON). */}}
{{- if eq (include "grad.workerAuth" .) "static" }}
{{- $pools := list }}
{{- range $pool, $w := omit .Values.workers "auth" }}
{{- if $w.enabled }}
{{- $key := printf "worker-%s-api-key" $pool }}
{{- $value := get $keep $key | default (printf "grad_worker_%s" (randAlphaNum 40)) }}
{{- $_ := set $data $key $value }}
{{- $pools = append $pools (dict "label" $pool "sha256" (sha256sum $value) "kinds" $w.kinds) }}
{{- end }}
{{- end }}
{{- $_ := set $data "trainer-keys-json" (toJson $pools) }}
{{- end }}
{{- if .Values.metrics.requireToken }}
{{- $_ := set $data "metrics-token" ($s.metricsToken | default (get $keep "metrics-token") | default (randAlphaNum 40)) }}
{{- end }}
{{- range $key, $value := dict "inference-api-key" $s.inferenceApiKey "judge-api-key" $s.judgeApiKey "cloud-service-token" $s.cloudServiceToken "cloud-auth-database-url" $s.cloudAuthDatabaseUrl "cloud-gateway-token" $s.cloudGatewayToken "aws-access-key-id" $s.awsAccessKeyId "aws-secret-access-key" $s.awsSecretAccessKey "orchestrator-keys-json" $s.orchestratorKeysJson }}
{{- if $value }}{{ $_ := set $data $key $value }}{{ end }}
{{- end }}
# Created before the migrations Job (a pre-install/pre-upgrade hook needs it) and
# never deleted by `helm uninstall`, so the generated keys (and the workspace
# secrets sealed with secrets-key) survive a reinstall. Delete it by hand.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "grad.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
