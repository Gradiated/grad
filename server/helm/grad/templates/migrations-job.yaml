{{- if .Values.migrations.enabled }}
# Runs before the API rolls out on every install and upgrade (Argo CD maps the
# hook to PreSync). It needs only database-url; the API replicas start with
# MIGRATE_ON_BOOT=false and refuse to serve an unmigrated database.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "grad.fullname" . }}-migrate
  labels:
    {{- include "grad.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "grad.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "grad.podSecurity" (list 1000) | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args: ["node", "dist/main.js", "migrate"]
          env:
            {{- include "grad.secretEnv" (list . "DATABASE_URL" "database-url" false) | nindent 12 }}
          securityContext:
            {{- include "grad.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
