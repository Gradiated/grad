{{- if .Values.networkPolicy.enabled }}
# The API accepts traffic only from this release's workers and the configured peers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grad.fullname" . }}-api
  labels:
    {{- include "grad.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: worker
        {{- with .Values.networkPolicy.apiIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.port }}
    {{- if and .Values.metrics.enabled .Values.metrics.allowFrom }}
    # Prometheus and KEDA scrape the metrics port.
    - from:
        {{- toYaml .Values.metrics.allowFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
    {{- end }}
    {{- if and (gt (int .Values.api.internalPort) 0) .Values.networkPolicy.internalIngressFrom }}
    # The internal listener: only the configured peers (the product API).
    - from:
        {{- toYaml .Values.networkPolicy.internalIngressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.internalPort }}
    {{- end }}
---
# Workers reach DNS, the API and the egress allowlist, nothing else; only the
# metrics port accepts traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grad.fullname" . }}-workers
  labels:
    {{- include "grad.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  policyTypes: [Ingress, Egress]
  {{- if and (gt (int .Values.metrics.workerPort) 0) .Values.metrics.allowFrom }}
  ingress:
    - from:
        {{- toYaml .Values.metrics.allowFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.workerPort }}
  {{- end }}
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.port }}
    {{- with .Values.networkPolicy.workerEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.networkPolicy.inferenceEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
