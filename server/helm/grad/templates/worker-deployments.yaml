{{- range $name, $w := omit .Values.workers "auth" }}
{{- if $w.enabled }}
{{- $d := $.Values.workerDefaults }}
{{- $image := mergeOverwrite (deepCopy $d.image) ($w.image | default dict) }}
{{- /* eval jobs run in a grad-server container; the trainer takes the rest. */}}
{{- $trainerKinds := without $w.kinds "eval" }}
{{- $k8s := eq (include "grad.workerAuth" $) "kubernetes" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grad.fullname" $ }}-worker-{{ $name }}
  labels:
    {{- include "grad.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    grad.gradiated.com/worker: {{ $name }}
spec:
  {{- if not $.Values.keda.enabled }}
  replicas: {{ $w.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: worker
      grad.gradiated.com/worker: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "grad.labels" $ | nindent 8 }}
        app.kubernetes.io/component: worker
        grad.gradiated.com/worker: {{ $name }}
    spec:
      {{- if $k8s }}
      serviceAccountName: {{ include "grad.poolServiceAccount" (list $ $name) }}
      {{- else }}
      serviceAccountName: {{ include "grad.workerServiceAccount" $ }}
      {{- end }}
      # No Kubernetes API token: in workers.auth=kubernetes the pod gets only a
      # grad-audience token (volume worker-token), useless against the API server.
      automountServiceAccountToken: false
      {{- if and $w.lowPriority $.Values.trainingPriorityClass.enabled }}
      priorityClassName: {{ include "grad.trainingPriorityClass" $ }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $w.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "grad.podSecurity" (list 10001) | nindent 8 }}
      {{- with $w.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- if $trainerKinds }}
        - name: grad-trainer
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: {{ $image.pullPolicy }}
          {{- if gt (int $.Values.metrics.workerPort) 0 }}
          ports:
            - name: metrics
              containerPort: {{ $.Values.metrics.workerPort }}
          {{- end }}
          env:
            - name: GRAD_SERVER_URL
              value: "http://{{ include "grad.fullname" $ }}-api:{{ $.Values.api.service.port }}"
            - {name: GRAD_WORKER_KINDS, value: {{ join "," $trainerKinds | quote }}}
            - {name: GRAD_POLL_INTERVAL_S, value: {{ $d.pollIntervalSeconds | quote }}}
            - {name: GRAD_LEASE_SECONDS, value: {{ $d.leaseSeconds | quote }}}
            {{- if gt (int $.Values.metrics.workerPort) 0 }}
            - {name: GRAD_WORKER_METRICS_PORT, value: {{ $.Values.metrics.workerPort | quote }}}
            {{- end }}
            # Pod name, readable in leases and logs; the worker appends a per-process
            # suffix, so a restarted container takes a new attempt.
            - name: GRAD_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with $.Values.models.mirror }}
            - {name: GRAD_MODELS_MIRROR, value: {{ . | quote }}}
            {{- end }}
            {{- if $k8s }}
            # The projected service-account token, re-read on every request (the kubelet rotates it).
            - {name: GRAD_WORKER_TOKEN_FILE, value: /var/run/secrets/grad/worker/token}
            {{- else }}
            - name: TRAINER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "grad.secretName" $ }}
                  key: {{ include "grad.workerKeyName" (list $ $name $w) }}
            {{- end }}
            {{- range $k, $v := $w.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          securityContext:
            {{- include "grad.containerSecurity" $ | nindent 12 }}
          resources:
            requests:
              {{- toYaml $w.resources.requests | nindent 14 }}
              {{- if gt (int $w.gpuCount) 0 }}
              nvidia.com/gpu: {{ $w.gpuCount }}
              {{- end }}
            limits:
              {{- toYaml $w.resources.limits | nindent 14 }}
              {{- if gt (int $w.gpuCount) 0 }}
              nvidia.com/gpu: {{ $w.gpuCount }}
              {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: hf-cache
              mountPath: /home/grad/.cache
            {{- if $k8s }}
            - name: worker-token
              mountPath: /var/run/secrets/grad/worker
              readOnly: true
            {{- end }}
        {{- end }}
        {{- if has "eval" $w.kinds }}
        # Evals, dataset.score() and router labelling: calls the inference and
        # judge endpoints and posts the outputs to the API (no GPU; eval jobs carry no workspace secrets).
        - name: grad-eval-worker
          image: "{{ $.Values.api.image.repository }}:{{ $.Values.api.image.tag }}"
          imagePullPolicy: {{ $.Values.api.image.pullPolicy }}
          command: ["node", "dist/main.js", "worker", "--kinds", "eval"]
          env:
            - name: GRAD_SERVER_URL
              value: "http://{{ include "grad.fullname" $ }}-api:{{ $.Values.api.service.port }}"
            - {name: GRAD_POLL_INTERVAL_S, value: {{ $d.pollIntervalSeconds | quote }}}
            - {name: GRAD_LEASE_SECONDS, value: {{ $d.leaseSeconds | quote }}}
            - {name: EVAL_CONCURRENCY, value: {{ $.Values.evals.concurrency | quote }}}
            - name: GRAD_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with $.Values.evals.inferenceBaseUrl }}
            - {name: GRAD_INFERENCE_BASE_URL, value: {{ . | quote }}}
            {{- end }}
            {{- with $.Values.evals.judgeBaseUrl }}
            - {name: GRAD_JUDGE_BASE_URL, value: {{ . | quote }}}
            {{- end }}
            {{- include "grad.secretEnv" (list $ "GRAD_INFERENCE_API_KEY" "inference-api-key" true) | nindent 12 }}
            {{- include "grad.secretEnv" (list $ "GRAD_JUDGE_API_KEY" "judge-api-key" true) | nindent 12 }}
            {{- if $k8s }}
            - {name: GRAD_WORKER_TOKEN_FILE, value: /var/run/secrets/grad/worker/token}
            {{- else }}
            - name: TRAINER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "grad.secretName" $ }}
                  key: {{ include "grad.workerKeyName" (list $ $name $w) }}
            {{- end }}
          securityContext:
            {{- include "grad.containerSecurity" $ | nindent 12 }}
            # The grad-server image's user.
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            {{- toYaml $.Values.evals.workerResources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $k8s }}
            - name: worker-token
              mountPath: /var/run/secrets/grad/worker
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: hf-cache
          emptyDir: {}
        {{- if $k8s }}
        - name: worker-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: grad
                  expirationSeconds: 3600
                  path: token
        {{- end }}
{{- end }}
{{- end }}
