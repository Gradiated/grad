# Test values for tests/helm/smoke.sh: locally built images, in-cluster
# Postgres (TLS only) and SeaweedFS fixtures, the reference trainer backend, small requests.
# The chart creates its Secret (admin key, worker keys, secrets-key) itself.
secrets:
  databaseUrl: postgres://grad:grad-kind-only@postgres:5432/grad
  awsAccessKeyId: gradkind
  awsSecretAccessKey: grad-kind-only-secret
# The fixture Postgres serves a certificate from smoke.sh's throwaway CA.
database:
  caBundle:
    configMap: {name: postgres-ca}
api:
  replicaCount: 2
  image: {repository: grad-server, tag: dev, pullPolicy: Never}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
storage:
  s3Bucket: grad-kind
  s3Endpoint: http://seaweedfs:8333
workerDefaults:
  image: {repository: grad-trainer, pullPolicy: Never}
  leaseSeconds: 30
workers:
  train:
    image: {tag: dev}
    gpuCount: 0
    terminationGracePeriodSeconds: 30
    env:
      GRAD_TRAINER_BACKEND: reference
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 768Mi}
  import:
    image: {tag: dev}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 768Mi}
networkPolicy:
  enabled: true
  workerEgress:
    # The in-cluster SeaweedFS fixture (presigned dataset and artifact URLs).
    - to:
        - podSelector: {matchLabels: {app: seaweedfs}}
      ports:
        - {protocol: TCP, port: 8333}
