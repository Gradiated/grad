# Compose override for the local-stack smoke test (tests/compose/smoke.sh).
# Test-only: the trainer never downloads. Evals call grad-dev-inference, which
# `grad local up --dev-models` starts with the tiny test models. Paths are
# relative to server/.
services:
  grad-trainer:
    environment:
      GRAD_OFFLINE: "1"
      GRAD_TORCH_THREADS: "2"
