# Test-only fixtures for tests/helm/smoke.sh: a throwaway Postgres and SeaweedFS.
# Postgres takes TLS connections only, with the certificate smoke.sh issues
# (Secret postgres-tls) for the Service name `postgres`.
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
# The same Postgres under a name its certificate lacks (verify-full must refuse it).
apiVersion: v1
kind: Service
metadata: {name: postgres-alias}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
          # The key must belong to postgres with mode 0600; TCP clients need TLS (hostssl).
          command: [sh, -c]
          args:
            - >-
              mkdir -p /tls && cp /tls-src/tls.crt /tls/server.crt && cp /tls-src/tls.key /tls/server.key &&
              printf 'local all all trust\nhostssl all all all scram-sha-256\n' > /tls/pg_hba.conf &&
              chown -R postgres /tls && chmod 600 /tls/server.key &&
              exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tls/server.crt
              -c ssl_key_file=/tls/server.key -c hba_file=/tls/pg_hba.conf
          volumeMounts:
            - {name: tls, mountPath: /tls-src, readOnly: true}
          env:
            - {name: POSTGRES_USER, value: grad}
            - {name: POSTGRES_PASSWORD, value: grad-kind-only}
            - {name: POSTGRES_DB, value: grad}
          readinessProbe:
            exec: {command: [pg_isready, -U, grad, -d, grad]}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - {name: tls, secret: {secretName: postgres-tls}}
---
# SeaweedFS (single-node S3, as `grad local up` runs it), with the bucket
# created at startup and the test key from the Secret below.
apiVersion: v1
kind: Secret
metadata: {name: s3-config}
stringData:
  s3.json: '{"identities": [{"name": "grad", "credentials": [{"accessKey": "gradkind", "secretKey": "grad-kind-only-secret"}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}'
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs}
spec:
  selector: {app: seaweedfs}
  ports: [{port: 8333}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: seaweedfs}
spec:
  selector: {matchLabels: {app: seaweedfs}}
  template:
    metadata: {labels: {app: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
          args: [mini, -dir=/data, -s3.config=/etc/seaweedfs/s3.json, -bucket=grad-kind, -webdav=false,
                 -admin.ui=false, -s3.port.iceberg=0, -s3.port.lance=0, -master.telemetry=false]
          volumeMounts:
            - {name: config, mountPath: /etc/seaweedfs, readOnly: true}
            - {name: data, mountPath: /data}
          readinessProbe:
            exec: {command: [sh, -c, "wget -q -O /dev/null http://127.0.0.1:8333/healthz && wget -q -O /dev/null http://127.0.0.1:8888/buckets/grad-kind/"]}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 384Mi}
      volumes:
        - {name: config, secret: {secretName: s3-config}}
        - {name: data, emptyDir: {}}
