# Default gitleaks rules plus an allowlist for test fixtures that carry fake,
# clearly non-functional provider keys (e.g. "sk-test-0123456789").
[extend]
useDefault = true

[allowlist]
description = "Fake credentials in test fixtures (provider stubs, wire fixtures captured from the throwaway test stack)"
paths = [
  '''^server/trainer/tests/fixtures/providers/''',
  '''^tests/fixtures/wire/''',
  '''^sdks/typescript/test/''',
  '''^server/ui/test/''',
]
# Fake keys in tests spell out 0123456789 (sk-test-0123456789, wandb-live-0123456789).
stopwords = ["0123456789"]
# generic-api-key reads `secret="hf-token", idempotency_key="..."` as a key
# assignment and reports the argument name itself as the secret.
regexes = ['''^idempotency_key=?$''']
